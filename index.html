<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gyro Cylinder Attack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=JetBrains+Mono:wght@700&display=swap');

        body {
            background-color: #0f172a; /* Slate 900 */
            color: white;
            overflow: hidden;
            touch-action: none; /* 스크롤 방지 */
        }

        /* 3D 씬 및 원기둥 설정 */
        .scene {
            width: 200px;
            height: 200px;
            perspective: 800px;
            margin: auto;
        }

        .cylinder {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            /* 초기 상태 */
            transform: rotateX(0deg); 
        }

        /* 8각 기둥의 각 면 (너비 200px, 높이 100px) */
        .face {
            position: absolute;
            top: 50px; /* 200px 중앙에 100px 높이 배치 */
            left: 0;
            width: 200px;
            height: 100px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.8), rgba(30, 58, 138, 0.9));
            border: 2px solid rgba(56, 189, 248, 0.5);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Black Ops One', cursive;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.7);
            backface-visibility: hidden;
        }

        /* 
         * 8각 기둥 각도 계산 (360 / 8 = 45도)
         * 반지름(Z축 이동) 계산: (높이 100 / 2) / Math.tan(22.5도) ≈ 120.7px
         */
        .face:nth-child(1) { transform: rotateX(0deg) translateZ(121px); }
        .face:nth-child(2) { transform: rotateX(45deg) translateZ(121px); }
        .face:nth-child(3) { transform: rotateX(90deg) translateZ(121px); }
        .face:nth-child(4) { transform: rotateX(135deg) translateZ(121px); }
        .face:nth-child(5) { transform: rotateX(180deg) translateZ(121px); }
        .face:nth-child(6) { transform: rotateX(225deg) translateZ(121px); }
        .face:nth-child(7) { transform: rotateX(270deg) translateZ(121px); }
        .face:nth-child(8) { transform: rotateX(315deg) translateZ(121px); }

        /* 공격 시 이펙트 애니메이션 */
        @keyframes flashEffect {
            0% { background-color: rgba(220, 38, 38, 0.8); } /* Red 600 */
            100% { background-color: transparent; }
        }
        .flash-active {
            animation: flashEffect 0.5s ease-out forwards;
        }

        @keyframes textPop {
            0% { transform: scale(0.5); opacity: 0; }
            30% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        .attack-text {
            font-family: 'Black Ops One', cursive;
            text-shadow: 0 0 20px rgba(220, 38, 38, 0.8);
            opacity: 0;
        }
        .attack-text-active {
            animation: textPop 0.5s ease-out forwards;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen justify-center items-center relative">

    <!-- 공격 화면 번쩍임 효과 레이어 -->
    <div id="flash-overlay" class="absolute inset-0 pointer-events-none z-10 transition-colors"></div>

    <!-- 거대한 공격 텍스트 -->
    <div id="attack-text" class="absolute inset-0 flex items-center justify-center pointer-events-none z-20 attack-text">
        <span class="text-7xl font-bold text-red-500 tracking-wider">ATTACK!</span>
    </div>

    <!-- 3D 씬 (중앙 원기둥) -->
    <div class="scene z-0 mt-[-100px]">
        <div class="cylinder" id="cylinder">
            <div class="face">FACE 1</div>
            <div class="face">FACE 2</div>
            <div class="face">FACE 3</div>
            <div class="face">FACE 4</div>
            <div class="face">FACE 5</div>
            <div class="face">FACE 6</div>
            <div class="face">FACE 7</div>
            <div class="face">FACE 8</div>
        </div>
    </div>

    <!-- 하단 원격 측정(디버그) 패널 -->
    <div class="absolute bottom-8 left-0 w-full px-6 z-30">
        <div class="bg-slate-800/80 backdrop-blur-sm border border-slate-700 p-4 rounded-xl shadow-xl">
            <h3 class="text-xs font-bold text-sky-400 mb-2 uppercase tracking-widest flex justify-between">
                <span>Sensor Telemetry</span>
                <span id="cooldown-indicator" class="w-2 h-2 rounded-full bg-green-500"></span>
            </h3>
            <div class="grid grid-cols-2 gap-4 mono text-sm">
                <div>
                    <p class="text-slate-400 text-xs">Tilt (Beta)</p>
                    <p id="val-beta" class="text-white">0.00°</p>
                </div>
                <div>
                    <p class="text-slate-400 text-xs">Swing Speed (Gamma)</p>
                    <p id="val-gamma" class="text-white">0.00 °/s</p>
                </div>
            </div>
            <p class="text-[10px] text-slate-500 mt-3 text-center">폰을 뉘여서 앞뒤로 기울이거나(회전), 양옆으로 빠르게 흔들어(공격) 보세요.</p>
        </div>
    </div>

    <!-- 초기 권한 요청 오버레이 (iOS 대응) -->
    <div id="permission-overlay" class="absolute inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl text-center max-w-sm border border-slate-700">
            <div class="w-16 h-16 bg-sky-500/20 text-sky-400 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
            </div>
            <h2 class="text-xl font-bold text-white mb-2">모션 센서 활성화</h2>
            <p class="text-sm text-slate-400 mb-6">원기둥을 조작하고 공격 액션을 수행하려면 센서 접근 권한이 필요합니다.</p>
            <button id="btn-start" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-lg shadow-sky-500/30">
                시작하기
            </button>
        </div>
    </div>

    <script>
        // DOM 요소
        const btnStart = document.getElementById('btn-start');
        const overlay = document.getElementById('permission-overlay');
        const cylinder = document.getElementById('cylinder');
        
        const valBeta = document.getElementById('val-beta');
        const valGamma = document.getElementById('val-gamma');
        
        const flashOverlay = document.getElementById('flash-overlay');
        const attackText = document.getElementById('attack-text');
        const cooldownIndicator = document.getElementById('cooldown-indicator');

        // 상태 변수
        let currentBeta = 0; // LERP 적용된 현재 각도
        let targetBeta = 0;  // 센서가 읽은 목표 각도
        
        let isCooldown = false;
        const ATTACK_THRESHOLD = 250; // 이 수치를 넘으면 공격 (원하는 민감도에 따라 조절)
        const COOLDOWN_TIME = 500;    // 500ms

        // 권한 요청 및 시작
        btnStart.addEventListener('click', async () => {
            try {
                // iOS 13 이상을 위한 권한 요청
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const orientationPerm = await DeviceOrientationEvent.requestPermission();
                    const motionPerm = await DeviceMotionEvent.requestPermission();
                    
                    if (orientationPerm === 'granted' && motionPerm === 'granted') {
                        startSensors();
                    } else {
                        alert("센서 권한이 거부되었습니다.");
                    }
                } else {
                    // 안드로이드 및 기타 브라우저 (권한 요청 불필요)
                    startSensors();
                }
            } catch (error) {
                console.error("Permission error:", error);
                startSensors(); // 에러 발생 시에도 일단 실행 시도
            }
        });

        function startSensors() {
            // 오버레이 숨기기
            overlay.classList.add('hidden');

            // 1. DeviceOrientation: 원기둥 회전용 각도(Beta) 수집
            window.addEventListener('deviceorientation', (event) => {
                if (event.beta !== null) {
                    // Beta 값 (-180 ~ 180). 사용자가 보기 편하게 배율 조정 가능.
                    targetBeta = event.beta;
                    
                    // 디스플레이 업데이트
                    valBeta.textContent = targetBeta.toFixed(2) + "°";
                }
            });

            // 2. DeviceMotion: 공격 판정용 회전 속도(Gamma) 수집
            window.addEventListener('devicemotion', (event) => {
                if (event.rotationRate && event.rotationRate.gamma !== null) {
                    const gammaSpeed = event.rotationRate.gamma;
                    
                    // 디스플레이 업데이트
                    valGamma.textContent = gammaSpeed.toFixed(2) + " °/s";

                    // 공격 판정 로직
                    checkAttack(gammaSpeed);
                }
            });

            // 애니메이션 루프 시작
            requestAnimationFrame(animate);
        }

        // LERP 기반 부드러운 애니메이션 루프
        function animate() {
            // LERP 공식: 현재값 += (목표값 - 현재값) * 보간계수(0.0~1.0)
            // 계수가 낮을수록 움직임이 무겁고 부드러워짐
            currentBeta += (targetBeta - currentBeta) * 0.15;
            
            // X축을 기준으로 원기둥 회전 (스크롤 하듯 굴리기)
            cylinder.style.transform = `rotateX(${-currentBeta}deg)`;

            requestAnimationFrame(animate);
        }

        function checkAttack(speed) {
            // 쿨타임 중이 아니고, 회전 속도의 절댓값이 임계치를 넘었을 때
            if (!isCooldown && Math.abs(speed) > ATTACK_THRESHOLD) {
                triggerAttackEffect();
                
                // 쿨타임 시작
                isCooldown = true;
                cooldownIndicator.classList.replace('bg-green-500', 'bg-red-500');
                
                // 지정된 시간 후 쿨타임 해제
                setTimeout(() => {
                    isCooldown = false;
                    cooldownIndicator.classList.replace('bg-red-500', 'bg-green-500');
                }, COOLDOWN_TIME);
            }
        }

        function triggerAttackEffect() {
            // 애니메이션 클래스 초기화를 위해 제거 후 강제 리플로우(Reflow) 발생
            flashOverlay.classList.remove('flash-active');
            attackText.classList.remove('attack-text-active');
            
            void flashOverlay.offsetWidth; // Trigger reflow
            void attackText.offsetWidth;
            
            // 애니메이션 클래스 추가
            flashOverlay.classList.add('flash-active');
            attackText.classList.add('attack-text-active');
            
            // 진동 모터가 있는 경우 짧은 진동 발생 (안드로이드)
            if (navigator.vibrate) {
                navigator.vibrate(100);
            }
        }
    </script>
</body>
</html>
