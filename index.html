<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 환경에 맞게 뷰포트 설정, 확대/축소 방지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>기울기 센서 원기둥 제어</title>
    <!-- Tailwind CSS 불러오기 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            /* 어두운 테마 배경 및 텍스트 색상 설정 */
            background-color: #1a202c; 
            color: white;
            font-family: 'Inter', sans-serif;
            /* 스크롤 방지 및 터치 동작 제어 */
            overflow: hidden; 
            touch-action: none;
        }

        .scene {
            /* 3D 씬을 화면 하단 중앙에 배치 */
            position: absolute;
            bottom: 15%; 
            left: 50%;
            /* 원기둥 크기(1200px)가 모바일 화면에 들어가도록 0.35배 축소 및 수평 중앙 정렬 */
            transform: translateX(-50%) scale(0.35);
            /* 축소의 기준점을 하단 중앙으로 설정 */
            transform-origin: bottom center;
            display: flex;
            justify-content: center;
        }

        .cylinder {
            /* 요구사항에 맞춘 원기둥 크기 */
            width: 150px;
            height: 1200px;
            /* 3D 금속 느낌을 주기 위한 선형 그라데이션 */
            background: linear-gradient(to right, #4a5568 0%, #cbd5e0 40%, #ffffff 50%, #cbd5e0 60%, #2d3748 100%);
            /* 원기둥의 위아래 가장자리를 둥글게 처리 */
            border-radius: 75px / 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            
            /* [핵심] 회전 축: 자동차 속도계처럼 하단 중앙(바닥 부분)을 고정 */
            transform-origin: bottom center;
            
            /* 센서 값 변경 시 부드럽게 회전하도록 트랜지션 추가 */
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }
        
        .base-pivot {
            /* 원기둥 하단에 고정된 축 느낌을 주기 위한 장식 요소 */
            position: absolute;
            bottom: -20px;
            width: 60px;
            height: 60px;
            background: #e2e8f0;
            border-radius: 50%;
            border: 5px solid #4a5568;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            z-index: 10;
        }
    </style>
</head>
<body class="flex flex-col h-screen relative">

    <!-- 경고/알림 메시지를 표시할 박스 (alert 대체) -->
    <div id="message-box" class="hidden absolute top-10 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-lg shadow-2xl z-50 transition-opacity font-semibold">
        알림 메시지
    </div>

    <!-- 상단 UI 및 정보 표시 영역 -->
    <div class="relative z-20 flex flex-col items-center pt-10 px-4 w-full text-center space-y-4">
        <h1 class="text-2xl font-bold text-gray-100">원기둥 기울기 제어</h1>
        
        <p class="text-sm text-gray-400 max-w-xs">
            스마트폰을 좌우로 기울여보세요.<br>
            (기기 센서 접근 권한이 필요할 수 있습니다.)
        </p>

        <!-- 제어 버튼 영역 -->
        <div class="flex space-x-4 mt-4">
            <!-- 센서 활성화 버튼 (iOS 권한 요청 용도) -->
            <button id="start-btn" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-full font-semibold shadow-lg transition transform active:scale-95">
                센서 시작
            </button>
            <!-- 영점 조절 (초기화) 버튼 -->
            <button id="reset-btn" class="px-6 py-3 bg-red-600 hover:bg-red-500 rounded-full font-semibold shadow-lg transition transform active:scale-95 hidden">
                영점 초기화
            </button>
        </div>

        <!-- 센서 디버그 정보 패널 -->
        <div class="bg-gray-800 bg-opacity-75 p-4 rounded-xl mt-6 border border-gray-700 w-full max-w-xs text-left shadow-inner">
            <div class="flex justify-between mb-2">
                <span class="text-gray-400">현재 센서값 (Gamma):</span>
                <span id="gamma-val" class="font-mono text-blue-300">0.00°</span>
            </div>
            <div class="flex justify-between mb-2">
                <span class="text-gray-400">영점 기준 (Base):</span>
                <span id="base-val" class="font-mono text-red-300">0.00°</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-400">실제 회전 각도:</span>
                <span id="rotation-val" class="font-mono text-green-300">0.00°</span>
            </div>
        </div>
    </div>

    <!-- 3D 원기둥 씬 -->
    <div class="scene">
        <div id="cylinder" class="cylinder"></div>
        <div class="base-pivot"></div>
    </div>

    <script>
        // DOM 요소 가져오기
        const cylinder = document.getElementById('cylinder');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        
        const gammaEl = document.getElementById('gamma-val');
        const baseEl = document.getElementById('base-val');
        const rotationEl = document.getElementById('rotation-val');
        const messageBox = document.getElementById('message-box');

        // 상태 변수 초기화
        let isSensorActive = false;
        let currentGamma = 0; // 현재 스마트폰의 좌우 기울기 값
        let baseGamma = 0;    // 영점 조절을 위한 기준 값 (오프셋)

        // 알림 메시지를 화면에 표시하는 함수 (시스템 alert 창 대체)
        function showMessage(msg) {
            messageBox.textContent = msg;
            messageBox.classList.remove('hidden');
            // 3초 후 메시지 박스 숨김
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 3000);
        }

        // UI 텍스트 및 원기둥 회전을 업데이트하는 함수
        function updateUI() {
            // 요구사항: Gamma 값이 작아지면 오른쪽으로 회전 (시계방향, 양수 각도)
            // 요구사항: Gamma 값이 커지면 왼쪽으로 회전 (반시계방향, 음수 각도)
            // 계산식: 회전 각도 = -(현재 Gamma - 기준 Gamma)
            let rotationAngle = -(currentGamma - baseGamma);
            
            // 원기둥이 거꾸로 도는 것을 방지하기 위해 회전 각도를 -90도 ~ +90도로 제한
            if (rotationAngle > 90) rotationAngle = 90;
            if (rotationAngle < -90) rotationAngle = -90;

            // 원기둥 DOM 요소에 CSS transform 적용 (바닥 축을 기준으로 회전)
            cylinder.style.transform = `rotate(${rotationAngle}deg)`;

            // 디버그용 텍스트 정보 업데이트 (소수점 2자리까지 표시)
            gammaEl.textContent = currentGamma.toFixed(2) + '°';
            baseEl.textContent = baseGamma.toFixed(2) + '°';
            rotationEl.textContent = rotationAngle.toFixed(2) + '°';
        }

        // 기기 방향(기울기) 센서 이벤트 핸들러
        function handleOrientation(event) {
            // event.gamma는 기기의 좌우 기울기를 나타냄 (단위: 도도, 범위: -90 ~ 90)
            if (event.gamma !== null) {
                currentGamma = event.gamma;
                updateUI();
            }
        }

        // 센서 권한 요청 및 시작 함수 (특히 iOS 13+ 기기에 필수)
        async function startSensor() {
            // 브라우저가 DeviceOrientationEvent와 requestPermission 메서드를 지원하는지 확인 (iOS 13+ Safari)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    // 사용자에게 센서 접근 권한 요청
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        // 권한이 허용되면 이벤트 리스너 등록
                        window.addEventListener('deviceorientation', handleOrientation);
                        activateApp();
                    } else {
                        // 권한이 거부된 경우 메시지 표시
                        showMessage('센서 접근 권한이 거부되었습니다.');
                    }
                } catch (error) {
                    console.error(error);
                    showMessage('권한 요청 중 오류가 발생했습니다.');
                }
            } else {
                // iOS 13 미만이거나 안드로이드 등 권한 요청이 필요 없는 브라우저
                window.addEventListener('deviceorientation', handleOrientation);
                activateApp();
            }
        }

        // 센서가 성공적으로 활성화된 후 UI 요소 상태 변경
        function activateApp() {
            isSensorActive = true;
            startBtn.classList.add('hidden'); // 센서 시작 버튼 숨김
            resetBtn.classList.remove('hidden'); // 영점 초기화 버튼 표시
            showMessage('센서가 활성화되었습니다!');
        }

        // 영점 조절 (초기화) 핸들러
        function resetCalibration() {
            // 현재 기울기를 새로운 기준점(0도)으로 설정
            baseGamma = currentGamma; 
            updateUI(); // 즉시 UI 업데이트하여 원기둥을 가운데(0도)로 복귀시킴
            showMessage('영점이 초기화되었습니다.');
        }

        // 버튼들에 클릭 이벤트 리스너 연결
        startBtn.addEventListener('click', startSensor);
        resetBtn.addEventListener('click', resetCalibration);

        // 페이지 로드 시 초기 상태 화면 렌더링 (PC 등 센서가 없는 환경에서의 테스트용)
        updateUI();
    </script>
</body>
</html>
