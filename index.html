<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebXR 디바이스 3D 미러링</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* 어두운 테마 배경 */
            color: white;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        
        #webgl-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* 3D 캔버스를 배경으로 배치 */
        }
        
        .ui-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none; /* UI 빈 공간 터치 시 캔버스로 이벤트 전달 */
        }
        
        .pointer-events-auto {
            pointer-events: auto; /* 버튼이나 박스 영역은 터치 가능하게 설정 */
        }
    </style>
</head>
<body>

    <div class="ui-layer flex flex-col items-center justify-between py-12 px-5">
        
        <!-- 상단 헤더 및 컨트롤 패널 -->
        <div class="text-center bg-slate-800 bg-opacity-75 p-6 rounded-2xl border border-slate-600 shadow-2xl backdrop-blur-md pointer-events-auto max-w-sm w-full">
            <h1 class="text-xl font-bold text-blue-400 mb-2">WebXR 3D 기기 트래킹</h1>
            <p class="text-xs text-slate-300 leading-relaxed mb-4">
                스마트폰의 WebXR 센서 퓨전을 사용하여 기기의 정밀한 3D 회전(Quaternion)을 읽고, 화면 중앙의 직육면체에 반영합니다.
            </p>
            
            <div id="start-ui">
                <button id="start-btn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold shadow-lg transition transform active:scale-95">
                    WebXR 센서 시작
                </button>
                <p class="text-[11px] text-slate-400 mt-3">
                    ※ 모바일 기기(Chrome for Android 등)에서 최적화되어 동작합니다. 카메라 권한은 필요하지 않습니다.
                </p>
            </div>
        </div>

        <!-- 알림 메시지 팝업 (alert 대체) -->
        <div id="message-box" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white px-6 py-3 rounded-lg font-medium shadow-2xl pointer-events-auto transition-opacity duration-300 opacity-0 z-50">
            알림 메시지
        </div>

        <!-- 실시간 Quaternion 데이터 출력 패널 -->
        <div id="info-ui" class="hidden bg-slate-800 bg-opacity-80 p-4 rounded-xl border border-slate-600 shadow-xl backdrop-blur-md pointer-events-auto w-full max-w-sm">
            <h2 class="text-sm font-semibold text-slate-200 mb-3 flex items-center justify-between">
                <span>센서 회전 벡터 (Quaternion)</span>
                <span class="flex h-2 w-2 relative">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                </span>
            </h2>
            <div class="grid grid-cols-2 gap-3 text-xs font-mono text-slate-300 text-left">
                <div class="bg-slate-900 p-2 rounded border border-slate-700">X: <span id="q-x" class="text-blue-300 float-right">0.000</span></div>
                <div class="bg-slate-900 p-2 rounded border border-slate-700">Y: <span id="q-y" class="text-green-300 float-right">0.000</span></div>
                <div class="bg-slate-900 p-2 rounded border border-slate-700">Z: <span id="q-z" class="text-red-300 float-right">0.000</span></div>
                <div class="bg-slate-900 p-2 rounded border border-slate-700">W: <span id="q-w" class="text-purple-300 float-right">1.000</span></div>
            </div>
        </div>
        
    </div>

    <!-- WebGL 렌더링 캔버스 -->
    <canvas id="webgl-canvas"></canvas>

    <script>
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        
        // 카메라 생성 및 설정
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
        scene.add(camera);

        // 렌더러 설정
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // [중요] Three.js의 WebXR 매니저 활성화
        renderer.xr.enabled = true;

        // 스마트폰 형태의 직육면체 생성 (가로 1.4, 세로 2.8, 두께 0.15)
        const geometry = new THREE.BoxGeometry(1.4, 2.8, 0.15);
        
        // 기기의 방향을 시각적으로 쉽게 알 수 있도록 면마다 색상을 다르게 지정합니다.
        const matBody = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.6 });
        const matScreen = new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.2 }); // 앞면(화면) 어둡게
        const matTop = new THREE.MeshStandardMaterial({ color: 0xef4444 }); // 윗면은 빨간색으로 포인트
        
        const materials = [
            matBody,   // 오른쪽 (Positive X)
            matBody,   // 왼쪽 (Negative X)
            matTop,    // 윗면 (Positive Y)
            matBody,   // 아랫면 (Negative Y)
            matScreen, // 앞면 (Positive Z) - 화면
            matBody    // 뒷면 (Negative Z)
        ];
        
        const phoneBox = new THREE.Mesh(geometry, materials);
        
        // 형체를 더 뚜렷하게 보기 위해 흰색 테두리(Edges) 추가
        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x94a3b8, linewidth: 2 }));
        phoneBox.add(line);

        // [핵심 트릭] 
        // WebXR이 활성화되면 카메라(Viewer)의 위치와 회전이 실제 기기의 움직임에 따라 변합니다.
        // 우리는 사용자가 화면 중앙에서 회전하는 박스를 관찰하게 만들고 싶으므로, 
        // 박스를 씬(Scene)이 아닌 카메라(Camera)의 자식 객체로 종속시키고 카메라 앞쪽에 배치합니다.
        camera.add(phoneBox);
        phoneBox.position.set(0, 0, -5); // 카메라 앞으로 5 유닛 떨어트림

        // 조명도 카메라에 종속시켜, 박스가 어느 방향으로 돌든 일관된 빛을 받도록 설정합니다.
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        camera.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(3, 4, 2);
        camera.add(dirLight);

        const btnStart = document.getElementById('start-btn');
        const msgBox = document.getElementById('message-box');
        const uiStart = document.getElementById('start-ui');
        const uiInfo = document.getElementById('info-ui');
        const qX = document.getElementById('q-x');
        const qY = document.getElementById('q-y');
        const qZ = document.getElementById('q-z');
        const qW = document.getElementById('q-w');

        // 알림 메시지 팝업 함수
        function showMessage(msg, isError = false) {
            msgBox.textContent = msg;
            msgBox.className = `absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 px-6 py-3 rounded-lg font-medium shadow-2xl pointer-events-auto transition-opacity duration-300 z-50 text-white ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
            msgBox.classList.remove('hidden');
            
            // Reflow 강제 후 투명도 조절로 페이드인 애니메이션
            void msgBox.offsetWidth;
            msgBox.classList.remove('opacity-0');
            
            setTimeout(() => {
                msgBox.classList.add('opacity-0');
                setTimeout(() => msgBox.classList.add('hidden'), 300);
            }, 3500);
        }

        // 브라우저 창 크기 변경 시 3D 화면 비율 업데이트
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        btnStart.addEventListener('click', async () => {
            // 1. 브라우저가 WebXR을 지원하는지 체크
            if ('xr' in navigator) {
                try {
                    // 2. 센서 데이터 기반 3DoF(회전)를 원활히 얻기 위해 'local' 레퍼런스 스페이스 요청
                    const sessionInit = { optionalFeatures: ['local'] };
                    
                    // 3. VR 기기나 카메라 배경 없이 브라우저 내에서만 도는 'inline' 세션 시작
                    const session = await navigator.xr.requestSession('inline', sessionInit);
                    
                    // 4. Three.js WebXR 매니저에 세션 연결
                    renderer.xr.setReferenceSpaceType('local');
                    await renderer.xr.setSession(session);
                    
                    // 5. UI 변경
                    uiStart.style.display = 'none';
                    uiInfo.classList.remove('hidden');
                    showMessage("WebXR 센서 연결 성공!");
                    
                } catch (error) {
                    console.error("WebXR Error:", error);
                    showMessage("세션 시작 실패 (센서를 지원하지 않는 기기일 수 있습니다.)", true);
                }
            } else {
                showMessage("이 브라우저는 WebXR을 지원하지 않습니다.", true);
            }
        });

        // WebXR 구동 시에는 requestAnimationFrame 대신 Three.js의 setAnimationLoop를 사용해야 합니다.
        renderer.setAnimationLoop((time) => {
            
            if (renderer.xr.isPresenting) {
                // [WebXR 작동 중]
                // WebXR API가 기기의 회전 상태를 Three.js의 'camera' 객체에 지속적으로 자동 업데이트합니다.
                
                // 카메라의 회전(기기의 회전) 값을 직육면체(phoneBox)의 로컬 회전값으로 복사합니다.
                // 박스가 카메라의 자식이므로, 이 작업을 통해 실제 사용자가 들고 있는 기기의 움직임이 
                // 화면 안의 박스에 1:1로 미러링(회전)되어 보이게 됩니다.
                phoneBox.quaternion.copy(camera.quaternion);

                // UI에 현재 쿼터니언 센서값을 실시간 출력
                qX.textContent = camera.quaternion.x.toFixed(3);
                qY.textContent = camera.quaternion.y.toFixed(3);
                qZ.textContent = camera.quaternion.z.toFixed(3);
                qW.textContent = camera.quaternion.w.toFixed(3);
                
            } else {
                // [WebXR 대기 중]
                // 세션 시작 전에는 밋밋하지 않게 천천히 공전하는 대기 애니메이션 재생
                phoneBox.rotation.y += 0.005;
                phoneBox.rotation.x = Math.sin(time * 0.001) * 0.1;
            }

            // 씬 렌더링
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
