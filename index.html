<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수직 원기둥 & 공격 센서</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            transition: background-color 0.1s;
        }

        /* 붉은색 번쩍임(공격) 효과 */
        body.attack {
            background-color: #ff0000;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            width: 90%;
            max-width: 400px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 10px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 14px;
        }

        /* 3D 원기둥 씬 설정 */
        #scene {
            perspective: 800px;
            width: 200px;
            height: 300px;
            margin-top: 150px;
            position: relative;
        }

        #cylinder {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            /* Y축을 기준으로 회전 */
            transform: rotateY(0deg); 
        }

        /* 원기둥의 각 면 (8각 기둥) */
        .face {
            position: absolute;
            width: 80px;
            height: 250px;
            left: 60px;
            top: 25px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: 2px solid #fff;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 24px;
            color: #000;
            opacity: 0.9;
        }

        /* 수학: 면 너비 80px, 반지름(Z거리) 약 96px */
        .face:nth-child(1) { transform: rotateY(0deg) translateZ(96px); }
        .face:nth-child(2) { transform: rotateY(45deg) translateZ(96px); }
        .face:nth-child(3) { transform: rotateY(90deg) translateZ(96px); }
        .face:nth-child(4) { transform: rotateY(135deg) translateZ(96px); }
        .face:nth-child(5) { transform: rotateY(180deg) translateZ(96px); }
        .face:nth-child(6) { transform: rotateY(225deg) translateZ(96px); }
        .face:nth-child(7) { transform: rotateY(270deg) translateZ(96px); }
        .face:nth-child(8) { transform: rotateY(315deg) translateZ(96px); }

        #attack-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 48px;
            font-weight: 900;
            color: yellow;
            text-shadow: 0 0 20px red;
            opacity: 0;
            transition: all 0.1s;
            pointer-events: none;
            z-index: 20;
        }

        #attack-msg.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }

        /* iOS 권한 요청 오버레이 */
        #permission-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- iOS 권한 요청 및 시작 화면 -->
    <div id="permission-overlay">
        <h2>센서 테스트</h2>
        <p>기기를 세로로 들고 시작해주세요.</p>
        <button id="start-btn">센서 권한 허용 및 시작</button>
    </div>

    <!-- 설정 및 데이터 UI -->
    <div id="ui-layer">
        <div class="slider-container">
            <label for="deadzone-slider">공격 데드존 (Gamma 회전 속도): <span id="deadzone-val">300</span></label>
            <input type="range" id="deadzone-slider" min="50" max="1000" value="300" step="10">
        </div>
        <div class="data-row">
            <span>X 기울기(Beta): <span id="val-beta">0</span>°</span>
            <span>Y 회전속도(Gamma): <span id="val-gamma">0</span></span>
        </div>
    </div>

    <!-- 3D 원기둥 영역 -->
    <div id="scene">
        <div id="cylinder">
            <div class="face">1</div>
            <div class="face">2</div>
            <div class="face">3</div>
            <div class="face">4</div>
            <div class="face">5</div>
            <div class="face">6</div>
            <div class="face">7</div>
            <div class="face">8</div>
        </div>
    </div>

    <!-- 공격 이펙트 -->
    <div id="attack-msg">ATTACK!</div>

    <script>
        const cylinder = document.getElementById('cylinder');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('permission-overlay');
        const attackMsg = document.getElementById('attack-msg');
        
        const deadzoneSlider = document.getElementById('deadzone-slider');
        const deadzoneValDisplay = document.getElementById('deadzone-val');
        const valBeta = document.getElementById('val-beta');
        const valGamma = document.getElementById('val-gamma');

        // 변수 설정
        let attackThreshold = 300; // 공격 데드존 기본값
        let isCooldown = false; // 공격 쿨타임 상태
        
        // 회전 관련 변수 (LERP용)
        let targetRotateY = 0;
        let currentRotateY = 0;

        // 1. 슬라이더 이벤트 (데드존 조절)
        deadzoneSlider.addEventListener('input', (e) => {
            attackThreshold = parseInt(e.target.value);
            deadzoneValDisplay.innerText = attackThreshold;
        });

        // 2. 시작 버튼 (권한 요청)
        startBtn.addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        initSensors();
                    } else {
                        alert('센서 권한이 거부되었습니다.');
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                // 안드로이드 등 권한이 필요 없는 기기
                initSensors();
            }
        });

        function initSensors() {
            overlay.style.display = 'none';

            // X축 기울기(Beta)로 원기둥 회전 타겟 설정
            window.addEventListener('deviceorientation', (event) => {
                if (event.beta === null) return;
                
                // 폰을 앞뒤로 기울이는 X축 값(Beta: -180 ~ 180)을 
                // 원기둥의 좌우 회전(Y축)에 매핑 (배율을 2배로 하여 잘 돌아가게 함)
                targetRotateY = event.beta * 2;
                valBeta.innerText = event.beta.toFixed(1);
            });

            // Y축 회전속도(Gamma)로 공격 감지
            window.addEventListener('devicemotion', (event) => {
                if (!event.rotationRate || event.rotationRate.gamma === null) return;
                
                const gammaRate = event.rotationRate.gamma;
                valGamma.innerText = gammaRate.toFixed(1);

                // 설정된 데드존(Threshold) 이상으로 폰을 비틀었을 때
                if (Math.abs(gammaRate) > attackThreshold && !isCooldown) {
                    triggerAttack();
                }
            });

            // 렌더링 루프 시작
            requestAnimationFrame(animate);
        }

        // 3. 부드러운 회전을 위한 LERP 함수 및 애니메이션 루프
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        function animate() {
            // 현재 회전값을 목표 회전값으로 10%씩 부드럽게 이동
            currentRotateY = lerp(currentRotateY, targetRotateY, 0.1);
            
            // 원기둥에 CSS 적용 (세로 원기둥이므로 rotateY 적용)
            cylinder.style.transform = `rotateY(${currentRotateY}deg)`;
            
            requestAnimationFrame(animate);
        }

        // 4. 공격 발동 로직
        function triggerAttack() {
            isCooldown = true;
            
            // 화면 번쩍임 및 텍스트 표시
            document.body.classList.add('attack');
            attackMsg.classList.add('show');

            // 이펙트 끄기 (0.15초 후)
            setTimeout(() => {
                document.body.classList.remove('attack');
                attackMsg.classList.remove('show');
            }, 150);

            // 쿨타임 해제 (0.5초 후)
            setTimeout(() => {
                isCooldown = false;
            }, 500);
        }
    </script>
</body>
</html>
