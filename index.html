<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>안정화된 와이퍼 원기둥 & 공격 센서</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            transition: background-color 0.1s;
        }

        body.attack { background-color: #ff0000; }
        body.charging { background-color: #4a4a00; }

        #ui-layer {
            position: absolute;
            top: 20px;
            width: 90%;
            max-width: 400px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 14px;
            margin-top: 10px;
        }

        /* 영점 조절 버튼 */
        #reset-btn {
            padding: 8px 12px;
            font-size: 12px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #reset-btn:active { background-color: #e64a19; }

        /* 3D 씬 설정 */
        #scene {
            perspective: 800px;
            width: 200px;
            height: 300px;
            margin-top: 220px;
            position: relative;
        }

        #cylinder {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transform-origin: 50% 100%; 
            transform: rotateZ(0deg); 
        }

        .face {
            position: absolute;
            width: 80px;
            height: 250px;
            left: 60px;
            top: 25px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: 2px solid #fff;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 24px;
            color: #000;
            opacity: 0.9;
        }

        .face:nth-child(1) { transform: rotateY(0deg) translateZ(96px); }
        .face:nth-child(2) { transform: rotateY(45deg) translateZ(96px); }
        .face:nth-child(3) { transform: rotateY(90deg) translateZ(96px); }
        .face:nth-child(4) { transform: rotateY(135deg) translateZ(96px); }
        .face:nth-child(5) { transform: rotateY(180deg) translateZ(96px); }
        .face:nth-child(6) { transform: rotateY(225deg) translateZ(96px); }
        .face:nth-child(7) { transform: rotateY(270deg) translateZ(96px); }
        .face:nth-child(8) { transform: rotateY(315deg) translateZ(96px); }

        #attack-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 48px;
            font-weight: 900;
            color: yellow;
            text-shadow: 0 0 20px red;
            opacity: 0;
            transition: all 0.1s;
            pointer-events: none;
            z-index: 20;
        }

        #attack-msg.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }

        #permission-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .start-btn {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="permission-overlay">
        <h2>센서 테스트</h2>
        <p>기기를 편하게 쥐고 시작해주세요.</p>
        <button class="start-btn" id="start-btn">센서 권한 허용 및 시작</button>
    </div>

    <!-- 설정 UI -->
    <div id="ui-layer">
        <div class="slider-container">
            <label>공격 민감도 (Gamma 속도): <span id="deadzone-val">300</span></label>
            <input type="range" id="deadzone-slider" min="50" max="1000" value="300" step="10">
        </div>
        <div class="slider-container">
            <label>요구 유지 시간 (ms): <span id="duration-val">150</span>ms</label>
            <input type="range" id="duration-slider" min="0" max="1000" value="150" step="10">
        </div>
        <div class="data-row">
            <span>보정된 기울기: <span id="val-beta">0</span>°</span>
            <button id="reset-btn">영점 조절 (초기화)</button>
        </div>
    </div>

    <!-- 3D 씬 -->
    <div id="scene">
        <div id="cylinder">
            <div class="face">1</div>
            <div class="face">2</div>
            <div class="face">3</div>
            <div class="face">4</div>
            <div class="face">5</div>
            <div class="face">6</div>
            <div class="face">7</div>
            <div class="face">8</div>
        </div>
    </div>

    <div id="attack-msg">ATTACK!</div>

    <script>
        const cylinder = document.getElementById('cylinder');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('permission-overlay');
        const attackMsg = document.getElementById('attack-msg');
        const resetBtn = document.getElementById('reset-btn');
        
        const deadzoneSlider = document.getElementById('deadzone-slider');
        const deadzoneValDisplay = document.getElementById('deadzone-val');
        const durationSlider = document.getElementById('duration-slider');
        const valBetaDisplay = document.getElementById('val-beta');

        // 상태 변수
        let attackThreshold = 300; 
        let requiredHoldTime = 150; 
        
        let isCooldown = false; 
        let isHolding = false;
        let holdStartTime = 0;

        // 회전 및 필터링 변수
        let rawBeta = 0;         // 센서에서 들어오는 날것의 각도
        let betaOffset = 0;      // 영점 조절을 위한 기준 각도
        let targetRotateZ = 0;
        let currentRotateZ = 0;

        // 슬라이더 이벤트
        deadzoneSlider.addEventListener('input', (e) => {
            attackThreshold = parseInt(e.target.value);
            deadzoneValDisplay.innerText = attackThreshold;
        });

        durationSlider.addEventListener('input', (e) => {
            requiredHoldTime = parseInt(e.target.value);
            document.getElementById('duration-val').innerText = requiredHoldTime;
        });

        // 영점 조절 버튼 이벤트
        resetBtn.addEventListener('click', () => {
            // 현재 쥐고 있는 날것의 각도를 새로운 기준점(0도)으로 설정
            betaOffset = rawBeta;
            targetRotateZ = 0; // 즉시 수직으로 리셋
        });

        startBtn.addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        initSensors();
                    } else {
                        alert('센서 권한이 거부되었습니다.');
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                initSensors();
            }
        });

        // -180 ~ 180 사이의 각도로 정규화하는 함수 (360도 경계선 회전 오차 해결)
        function normalizeAngle(angle) {
            let a = angle % 360;
            if (a > 180) a -= 360;
            if (a < -180) a += 360;
            return a;
        }

        function initSensors() {
            overlay.style.display = 'none';

            window.addEventListener('deviceorientation', (event) => {
                if (event.beta === null) return;
                
                let currentBeta = event.beta;
                
                // 1. 스파이크 필터 (값이 순간적으로 튀는 현상 방지)
                // 단 1프레임(약 16ms)만에 50도 이상 튀는 물리적으로 불가능한 움직임은 센서 노이즈로 간주하고 무시
                let diff = normalizeAngle(currentBeta - rawBeta);
                if (Math.abs(diff) > 50 && rawBeta !== 0) {
                    currentBeta = rawBeta; // 이전 정상 값으로 복구
                }
                rawBeta = currentBeta;

                // 2. 영점(Offset) 적용
                // 현재 기기의 각도에서 내가 설정한 영점을 빼줍니다.
                let adjustedBeta = normalizeAngle(rawBeta - betaOffset);
                
                targetRotateZ = adjustedBeta * 1.5; 
                valBetaDisplay.innerText = adjustedBeta.toFixed(1);
            });

            // 공격 로직 (이전과 동일)
            window.addEventListener('devicemotion', (event) => {
                if (!event.rotationRate || event.rotationRate.gamma === null) return;
                
                const gammaRate = event.rotationRate.gamma;

                if (isCooldown) return;

                if (Math.abs(gammaRate) > attackThreshold) {
                    if (!isHolding) {
                        isHolding = true;
                        holdStartTime = Date.now();
                        document.body.classList.add('charging'); 
                    } else {
                        const elapsedTime = Date.now() - holdStartTime;
                        if (elapsedTime >= requiredHoldTime) {
                            triggerAttack();
                        }
                    }
                } else {
                    if (isHolding) {
                        isHolding = false;
                        document.body.classList.remove('charging');
                    }
                }
            });

            requestAnimationFrame(animate);
        }

        // LERP 보간 및 렌더링
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        function animate() {
            // 부드러운 와이퍼 움직임 적용
            currentRotateZ = lerp(currentRotateZ, targetRotateZ, 0.15);
            cylinder.style.transform = `rotateZ(${currentRotateZ}deg)`;
            
            requestAnimationFrame(animate);
        }

        // 공격 발동
        function triggerAttack() {
            isCooldown = true;
            isHolding = false;
            
            document.body.classList.remove('charging');
            document.body.classList.add('attack');
            attackMsg.classList.add('show');

            setTimeout(() => {
                document.body.classList.remove('attack');
                attackMsg.classList.remove('show');
            }, 150);

            setTimeout(() => {
                isCooldown = false;
            }, 500);
        }
    </script>
</body>
</html>
