<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>와이퍼 원기둥 & 공격 센서</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            transition: background-color 0.1s;
        }

        /* 붉은색 번쩍임(공격) 효과 */
        body.attack {
            background-color: #ff0000;
        }

        /* 유지 중일 때의 시각적 피드백 (노란색) */
        body.charging {
            background-color: #4a4a00;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            width: 90%;
            max-width: 400px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 14px;
            margin-top: 10px;
        }

        /* 3D 씬 설정 */
        #scene {
            perspective: 800px;
            width: 200px;
            height: 300px;
            margin-top: 200px;
            position: relative;
        }

        #cylinder {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            /* 와이퍼처럼 하단을 기준으로 움직이도록 축 변경 */
            transform-origin: 50% 100%; 
            transform: rotateZ(0deg); 
        }

        /* 원기둥의 각 면 (8각 기둥) */
        .face {
            position: absolute;
            width: 80px;
            height: 250px;
            left: 60px;
            top: 25px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: 2px solid #fff;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 24px;
            color: #000;
            opacity: 0.9;
        }

        /* 원기둥 형태를 잡기 위한 3D 회전 */
        .face:nth-child(1) { transform: rotateY(0deg) translateZ(96px); }
        .face:nth-child(2) { transform: rotateY(45deg) translateZ(96px); }
        .face:nth-child(3) { transform: rotateY(90deg) translateZ(96px); }
        .face:nth-child(4) { transform: rotateY(135deg) translateZ(96px); }
        .face:nth-child(5) { transform: rotateY(180deg) translateZ(96px); }
        .face:nth-child(6) { transform: rotateY(225deg) translateZ(96px); }
        .face:nth-child(7) { transform: rotateY(270deg) translateZ(96px); }
        .face:nth-child(8) { transform: rotateY(315deg) translateZ(96px); }

        #attack-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 48px;
            font-weight: 900;
            color: yellow;
            text-shadow: 0 0 20px red;
            opacity: 0;
            transition: all 0.1s;
            pointer-events: none;
            z-index: 20;
        }

        #attack-msg.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }

        /* iOS 권한 요청 오버레이 */
        #permission-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #4facfe;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="permission-overlay">
        <h2>센서 테스트</h2>
        <p>기기를 세로로 들고 시작해주세요.</p>
        <button id="start-btn">센서 권한 허용 및 시작</button>
    </div>

    <!-- 설정 UI -->
    <div id="ui-layer">
        <div class="slider-container">
            <label>공격 민감도 (Gamma 속도): <span id="deadzone-val">300</span></label>
            <input type="range" id="deadzone-slider" min="50" max="1000" value="300" step="10">
        </div>
        <div class="slider-container">
            <label>요구 유지 시간 (ms): <span id="duration-val">150</span>ms</label>
            <input type="range" id="duration-slider" min="0" max="1000" value="150" step="10">
        </div>
        <div class="data-row">
            <span>X 기울기: <span id="val-beta">0</span>°</span>
            <span>Y 회전속도: <span id="val-gamma">0</span></span>
        </div>
    </div>

    <!-- 3D 씬 -->
    <div id="scene">
        <div id="cylinder">
            <div class="face">1</div>
            <div class="face">2</div>
            <div class="face">3</div>
            <div class="face">4</div>
            <div class="face">5</div>
            <div class="face">6</div>
            <div class="face">7</div>
            <div class="face">8</div>
        </div>
    </div>

    <div id="attack-msg">ATTACK!</div>

    <script>
        const cylinder = document.getElementById('cylinder');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('permission-overlay');
        const attackMsg = document.getElementById('attack-msg');
        
        const deadzoneSlider = document.getElementById('deadzone-slider');
        const deadzoneValDisplay = document.getElementById('deadzone-val');
        const durationSlider = document.getElementById('duration-slider');
        const durationValDisplay = document.getElementById('duration-val');
        
        const valBeta = document.getElementById('val-beta');
        const valGamma = document.getElementById('val-gamma');

        // 상태 변수
        let attackThreshold = 300; 
        let requiredHoldTime = 150; // ms 단위로 공격을 유지해야 하는 시간
        
        let isCooldown = false; 
        let isHolding = false;
        let holdStartTime = 0;

        // 회전 관련 변수 (LERP용)
        let targetRotateZ = 0;
        let currentRotateZ = 0;

        // 슬라이더 이벤트
        deadzoneSlider.addEventListener('input', (e) => {
            attackThreshold = parseInt(e.target.value);
            deadzoneValDisplay.innerText = attackThreshold;
        });

        durationSlider.addEventListener('input', (e) => {
            requiredHoldTime = parseInt(e.target.value);
            durationValDisplay.innerText = requiredHoldTime;
        });

        startBtn.addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        initSensors();
                    } else {
                        alert('센서 권한이 거부되었습니다.');
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                initSensors();
            }
        });

        function initSensors() {
            overlay.style.display = 'none';

            // X축 기울기(Beta)로 와이퍼(Z축) 회전 타겟 설정
            window.addEventListener('deviceorientation', (event) => {
                if (event.beta === null) return;
                
                // 기기를 앞뒤(Beta)로 기울이면 원기둥이 좌우(Z축)로 흔들리도록 매핑
                // 기울기 범위를 시각적으로 자연스럽게 증폭/제한
                targetRotateZ = event.beta * 1.5; 
                valBeta.innerText = event.beta.toFixed(1);
            });

            // Y축 회전속도(Gamma)로 공격 유지 감지
            window.addEventListener('devicemotion', (event) => {
                if (!event.rotationRate || event.rotationRate.gamma === null) return;
                
                const gammaRate = event.rotationRate.gamma;
                valGamma.innerText = gammaRate.toFixed(1);

                if (isCooldown) return;

                // 속도가 임계값을 넘었을 때 (조건 만족)
                if (Math.abs(gammaRate) > attackThreshold) {
                    if (!isHolding) {
                        // 처음 임계값을 넘은 순간 시간 기록
                        isHolding = true;
                        holdStartTime = Date.now();
                        document.body.classList.add('charging'); // 시각적 피드백
                    } else {
                        // 계속 유지 중일 때 흐른 시간 체크
                        const elapsedTime = Date.now() - holdStartTime;
                        
                        if (elapsedTime >= requiredHoldTime) {
                            triggerAttack();
                        }
                    }
                } else {
                    // 임계값 아래로 떨어지면 유지 상태 초기화 (충전 실패)
                    if (isHolding) {
                        isHolding = false;
                        document.body.classList.remove('charging');
                    }
                }
            });

            requestAnimationFrame(animate);
        }

        // LERP 보간 및 렌더링
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        function animate() {
            // 부드러운 와이퍼 움직임 적용
            currentRotateZ = lerp(currentRotateZ, targetRotateZ, 0.15);
            
            // 하단 기준(transform-origin: bottom)으로 좌우 흔들림(rotateZ)
            cylinder.style.transform = `rotateZ(${currentRotateZ}deg)`;
            
            requestAnimationFrame(animate);
        }

        // 공격 발동
        function triggerAttack() {
            isCooldown = true;
            isHolding = false;
            
            document.body.classList.remove('charging');
            document.body.classList.add('attack');
            attackMsg.classList.add('show');

            // 공격 이펙트 유지 (0.15초)
            setTimeout(() => {
                document.body.classList.remove('attack');
                attackMsg.classList.remove('show');
            }, 150);

            // 쿨타임 해제 (0.5초)
            setTimeout(() => {
                isCooldown = false;
            }, 500);
        }
    </script>
</body>
</html>
