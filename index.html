<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Air Mouse Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            /* Prevent mobile pull-to-refresh and scrolling */
            overscroll-behavior: none;
            touch-action: none; 
            margin: 0;
            overflow: hidden;
        }

        #cursor {
            position: absolute;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            background-color: #ef4444; /* Tailwind red-500 */
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.8), 0 0 5px rgba(255, 255, 255, 0.5);
            /* Center the cursor element on its coordinates */
            transform: translate(-50%, -50%);
            pointer-events: none; /* Let clicks pass through */
            z-index: 50;
            will-change: transform;
        }

        .panel-blur {
            background: rgba(30, 41, 59, 0.7); /* Slate 800 with opacity */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom range slider styling */
        input[type=range] {
            accent-color: #3b82f6; /* Blue 500 */
        }
    </style>
</head>
<body class="w-screen h-screen relative flex flex-col justify-end">

    <!-- The Virtual Cursor -->
    <div id="cursor" style="display: none;"></div>

    <!-- Start / Calibration Overlay -->
    <div id="overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900/90 backdrop-blur-sm px-4">
        <div class="panel-blur p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <i class="fa-solid fa-satellite-dish text-5xl text-blue-400 mb-4 animate-pulse"></i>
            <h1 class="text-2xl font-bold mb-2">가상 에어 마우스</h1>
            <p class="text-sm text-slate-400 mb-6">
                기기를 평행하게 들고 시작 버튼을 누르면 현재 위치가 화면의 중앙(0,0)으로 영점 조절됩니다.
            </p>
            <button id="btn-start" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-[0_0_15px_rgba(37,99,235,0.5)] active:scale-95">
                <i class="fa-solid fa-crosshairs mr-2"></i> 시작 및 영점 조절
            </button>
            <div id="perm-msg" class="mt-4 text-xs text-red-400 hidden">
                권한 요청이 거부되었습니다. 다시 시도해주세요.
            </div>
        </div>
    </div>

    <!-- Control Panel (Bottom) -->
    <div class="panel-blur m-4 p-4 rounded-xl z-40">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-sm font-bold text-slate-200"><i class="fa-solid fa-sliders mr-2"></i>제어판</h2>
            <button id="btn-recalibrate" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg transition-colors">
                <i class="fa-solid fa-rotate-right mr-1"></i> 재정렬
            </button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Sensibility Control -->
            <div class="flex flex-col">
                <label class="text-xs text-slate-400 mb-1 flex justify-between">
                    <span>민감도 (Sensitivity)</span>
                    <span id="lbl-sens">15 px/deg</span>
                </label>
                <input type="range" id="slider-sens" min="5" max="40" step="1" value="15" class="w-full">
            </div>

            <!-- Filter Strength (LPF) Control -->
            <div class="flex flex-col">
                <label class="text-xs text-slate-400 mb-1 flex justify-between">
                    <span>보정 강도 (Smoothing)</span>
                    <span id="lbl-filter">0.10 (부드러움)</span>
                </label>
                <input type="range" id="slider-filter" min="0.01" max="1.0" step="0.01" value="0.1" class="w-full">
            </div>
        </div>

        <!-- Debug Info -->
        <div class="mt-4 grid grid-cols-2 gap-2 text-[10px] sm:text-xs font-mono text-slate-400 bg-slate-900/50 p-2 rounded-lg border border-slate-700/50">
            <div>
                <span class="text-blue-400">RAW A:</span> <span id="debug-raw-a">0.0</span>°<br>
                <span class="text-green-400">RAW B:</span> <span id="debug-raw-b">0.0</span>°
            </div>
            <div>
                <span class="text-red-400">SMOOTH X:</span> <span id="debug-smooth-x">0</span>px<br>
                <span class="text-yellow-400">SMOOTH Y:</span> <span id="debug-smooth-y">0</span>px
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const elCursor = document.getElementById('cursor');
        const elOverlay = document.getElementById('overlay');
        const btnStart = document.getElementById('btn-start');
        const btnRecalibrate = document.getElementById('btn-recalibrate');
        const msgPerm = document.getElementById('perm-msg');
        
        // Sliders
        const sliderSens = document.getElementById('slider-sens');
        const sliderFilter = document.getElementById('slider-filter');
        const lblSens = document.getElementById('lbl-sens');
        const lblFilter = document.getElementById('lbl-filter');

        // Debug
        const dbgRawA = document.getElementById('debug-raw-a');
        const dbgRawB = document.getElementById('debug-raw-b');
        const dbgSmoothX = document.getElementById('debug-smooth-x');
        const dbgSmoothY = document.getElementById('debug-smooth-y');

        // State Variables
        let isTracking = false;
        
        // Raw Data
        let rawAlpha = 0;
        let rawBeta = 0;
        
        // Calibration Center
        let baseAlpha = null;
        let baseBeta = null;

        // Position Variables
        let centerX = window.innerWidth / 2;
        let centerY = window.innerHeight / 2;
        
        // Targets (before filtering)
        let targetX = centerX;
        let targetY = centerY;
        
        // Smoothed Output (applied Low-Pass Filter)
        let smoothedX = centerX;
        let smoothedY = centerY;

        // Configuration
        let sensitivity = parseFloat(sliderSens.value);
        let filterStrength = parseFloat(sliderFilter.value);

        // Update Settings from UI
        sliderSens.addEventListener('input', (e) => {
            sensitivity = parseFloat(e.target.value);
            lblSens.textContent = `${sensitivity} px/deg`;
        });

        sliderFilter.addEventListener('input', (e) => {
            filterStrength = parseFloat(e.target.value);
            // Smaller value = more smoothing. Larger value = closer to raw data.
            let label = "보통";
            if(filterStrength < 0.15) label = "아주 부드러움";
            else if(filterStrength > 0.5) label = "빠른 반응";
            lblFilter.textContent = `${filterStrength.toFixed(2)} (${label})`;
        });

        // Handle Window Resize
        window.addEventListener('resize', () => {
            centerX = window.innerWidth / 2;
            centerY = window.innerHeight / 2;
        });

        // Handle Device Orientation Data
        function handleOrientation(event) {
            // Some devices might return null if hardware is missing
            if (event.alpha === null || event.beta === null) return;
            
            rawAlpha = event.alpha;
            rawBeta = event.beta;

            if (baseAlpha === null || baseBeta === null) return; // Not calibrated yet

            // 1. Calculate Deltas
            let deltaAlpha = rawAlpha - baseAlpha;
            let deltaBeta = rawBeta - baseBeta;

            // 2. Wrap-around mitigation (0-360 boundaries)
            // If the angle jumps from 359 to 1, delta is -358. We fix it to +2.
            if (deltaAlpha > 180) deltaAlpha -= 360;
            if (deltaAlpha < -180) deltaAlpha += 360;
            
            // Beta usually ranges -180 to 180, but applying wrap-around fix prevents flip glitches
            if (deltaBeta > 180) deltaBeta -= 360;
            if (deltaBeta < -180) deltaBeta += 360;

            // 3. Map to Screen Coordinates
            // Requirement: alpha increases -> right (X increases)
            targetX = centerX - (deltaAlpha * sensitivity);
            
            // Requirement: beta increases -> up (Y decreases, since screen 0 is at top)
            targetY = centerY - (deltaBeta * sensitivity);
        }

        // Main Animation & Physics Loop
        function loop() {
            if (isTracking) {
                // Apply Low-Pass Filter (LPF)
                // Formula: smoothed = smoothed + filterStrength * (target - smoothed)
                smoothedX += filterStrength * (targetX - smoothedX);
                smoothedY += filterStrength * (targetY - smoothedY);

                // Clamp values to keep cursor on screen
                smoothedX = Math.max(0, Math.min(window.innerWidth, smoothedX));
                smoothedY = Math.max(0, Math.min(window.innerHeight, smoothedY));

                // Update Cursor Position visually
                elCursor.style.transform = `translate(${smoothedX}px, ${smoothedY}px)`;

                // Update Debug UI
                dbgRawA.textContent = rawAlpha.toFixed(1);
                dbgRawB.textContent = rawBeta.toFixed(1);
                dbgSmoothX.textContent = Math.round(smoothedX);
                dbgSmoothY.textContent = Math.round(smoothedY);
            }

            requestAnimationFrame(loop);
        }

        // Start Tracking & Set Center Base
        function startTracking() {
            window.addEventListener('deviceorientation', handleOrientation);
            
            // Allow a small delay for sensors to stabilize before setting base
            setTimeout(() => {
                baseAlpha = rawAlpha;
                baseBeta = rawBeta;
                
                // Snap smoothed coords to center immediately
                smoothedX = targetX = centerX;
                smoothedY = targetY = centerY;
                
                isTracking = true;
                elOverlay.classList.add('hidden');
                elCursor.style.display = 'block';
                
                // Start animation loop if not already running
                requestAnimationFrame(loop);
            }, 300);
        }

        // Recalibrate (Reset center point)
        btnRecalibrate.addEventListener('click', () => {
            baseAlpha = rawAlpha;
            baseBeta = rawBeta;
            
            // Reset to exact center immediately to prevent flying cursor
            targetX = centerX;
            targetY = centerY;
            smoothedX = centerX;
            smoothedY = centerY;
        });

        // Request Permissions (Required for iOS 13+)
        btnStart.addEventListener('click', () => {
            msgPerm.classList.add('hidden');
            
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startTracking();
                        } else {
                            msgPerm.classList.remove('hidden');
                        }
                    })
                    .catch(console.error);
            } else {
                // Non-iOS 13+ devices (Android, older iOS)
                startTracking();
            }
        });

    </script>
</body>
</html>
