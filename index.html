<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generic Sensor API 3D 미러링</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* 어두운 테마 배경 */
            color: white;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        
        #webgl-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* 3D 캔버스를 배경으로 배치 */
        }
        
        .ui-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none; /* UI 빈 공간 터치 시 통과 */
        }
        
        .pointer-events-auto {
            pointer-events: auto; /* 버튼이나 박스 영역은 터치 가능 */
        }
    </style>
</head>
<body>

    <div class="ui-layer flex flex-col items-center justify-between py-12 px-5">
        
        <div class="text-center bg-slate-800 bg-opacity-80 p-6 rounded-2xl border border-slate-600 shadow-2xl backdrop-blur-md pointer-events-auto max-w-sm w-full">
            <h1 class="text-xl font-bold text-amber-400 mb-2">AbsoluteOrientationSensor</h1>
            <p class="text-xs text-slate-300 leading-relaxed mb-4">
                Generic Sensor API를 사용하여 기기의 정밀한 절대 회전(Quaternion)을 읽고 3D 화면에 반영합니다.
            </p>
            
            <div id="start-ui">
                <button id="start-btn" class="w-full py-3.5 bg-amber-600 hover:bg-amber-500 text-white rounded-xl font-semibold shadow-lg transition transform active:scale-95">
                    센서 시작
                </button>
                <div class="mt-4 p-3 bg-slate-900 rounded-lg text-[11px] text-slate-400 text-left border border-slate-700">
                    <p class="mb-1"><strong class="text-red-400">필수 조건:</strong></p>
                    <ul class="list-disc pl-4 space-y-1">
                        <li><strong>HTTPS</strong> 보안 연결 환경</li>
                        <li><strong>Android Chrome</strong> 또는 Chromium 기반 브라우저</li>
                        <li>iOS Safari는 현재 지원하지 않습니다.</li>
                    </ul>
                </div>
            </div>
        </div>

        <div id="message-box" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white px-6 py-4 rounded-xl font-medium shadow-2xl pointer-events-auto transition-opacity duration-300 opacity-0 z-50 text-center min-w-[280px]">
            알림 메시지
        </div>

        <div id="info-ui" class="hidden bg-slate-800 bg-opacity-90 p-4 rounded-xl border border-slate-600 shadow-xl backdrop-blur-md pointer-events-auto w-full max-w-sm mb-8">
            <h2 class="text-sm font-semibold text-slate-200 mb-3 flex items-center justify-between">
                <span>센서 회전 데이터 실시간 반영 중</span>
                <span class="flex h-2 w-2 relative">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                </span>
            </h2>
            <div class="grid grid-cols-2 gap-3 text-xs font-mono text-slate-300 text-left">
                <div class="bg-slate-900 p-2 rounded border border-slate-700">X: <span id="q-x" class="text-blue-300 float-right">0.000</span></div>
                <div class="bg-slate-900 p-2 rounded border border-slate-700">Y: <span id="q-y" class="text-green-300 float-right">0.000</span></div>
                <div class="bg-slate-900 p-2 rounded border border-slate-700">Z: <span id="q-z" class="text-red-300 float-right">0.000</span></div>
                <div class="bg-slate-900 p-2 rounded border border-slate-700">W: <span id="q-w" class="text-purple-300 float-right">1.000</span></div>
            </div>
        </div>
        
    </div>

    <!-- WebGL 렌더링 캔버스 -->
    <canvas id="webgl-canvas"></canvas>

    <script>
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        
        // 카메라 설정 (Z축을 5만큼 뒤로 빼서 피사체를 바라봄)
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 5);

        // 렌더러 설정
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 가로, 세로, 두께 설정
        const geometry = new THREE.BoxGeometry(1.5, 3.0, 0.2);
        
        // 앞뒤 구분을 명확히 하기 위한 재질(Material) 설정
        const matBody = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.7 }); // 측면 및 뒷면 (회색)
        const matScreen = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.2, metalness: 0.8 }); // 앞면(화면) - 밝은 파란색
        const matTop = new THREE.MeshStandardMaterial({ color: 0xf43f5e }); // 윗면 - 빨간색 (방향 확인용)
        const matBack = new THREE.MeshStandardMaterial({ color: 0x1e293b }); // 뒷면 - 진한 남색
        
        // 박스의 6개 면에 각각 다른 재질 적용
        const materials = [
            matBody,   // 오른쪽
            matBody,   // 왼쪽
            matTop,    // 윗면 (빨간색)
            matBody,   // 아랫면
            matScreen, // 앞면 (파란색 화면)
            matBack    // 뒷면
        ];
        
        const phoneBox = new THREE.Mesh(geometry, materials);
        
        // 테두리(Edges) 추가로 윤곽선 강조
        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 }));
        phoneBox.add(line);
        scene.add(phoneBox);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(2, 5, 5);
        scene.add(dirLight);

        // 창 크기 변경 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const btnStart = document.getElementById('start-btn');
        const msgBox = document.getElementById('message-box');
        const uiStart = document.getElementById('start-ui');
        const uiInfo = document.getElementById('info-ui');
        const qX = document.getElementById('q-x');
        const qY = document.getElementById('q-y');
        const qZ = document.getElementById('q-z');
        const qW = document.getElementById('q-w');

        let isSensorActive = false;

        function showMessage(msg, isError = false) {
            msgBox.innerHTML = msg;
            msgBox.className = `absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 px-6 py-4 rounded-xl font-medium shadow-2xl pointer-events-auto transition-opacity duration-300 z-50 text-white min-w-[280px] ${isError ? 'bg-red-600 border-2 border-red-400' : 'bg-emerald-600 border-2 border-emerald-400'}`;
            msgBox.classList.remove('hidden');
            
            void msgBox.offsetWidth; // Reflow
            msgBox.classList.remove('opacity-0');
            
            setTimeout(() => {
                msgBox.classList.add('opacity-0');
                setTimeout(() => msgBox.classList.add('hidden'), 300);
            }, 4000);
        }

        btnStart.addEventListener('click', () => {
            // 1. 브라우저 지원 여부 확인 (Generic Sensor API)
            if ('AbsoluteOrientationSensor' in window) {
                try {
                    // 2. 센서 객체 생성 (초당 60회 업데이트 목표)
                    const sensor = new AbsoluteOrientationSensor({ frequency: 60 });

                    // 3. 데이터 읽기 이벤트 리스너 등록
                    sensor.addEventListener('reading', () => {
                        // 센서의 쿼터니언 데이터를 Three.js 객체에 직접 적용
                        // sensor.quaternion은 [x, y, z, w] 형태의 배열을 반환함
                        phoneBox.quaternion.fromArray(sensor.quaternion);

                        // UI 업데이트
                        qX.textContent = sensor.quaternion[0].toFixed(3);
                        qY.textContent = sensor.quaternion[1].toFixed(3);
                        qZ.textContent = sensor.quaternion[2].toFixed(3);
                        qW.textContent = sensor.quaternion[3].toFixed(3);
                    });

                    // 4. 센서 오류 처리 (권한 거부, 하드웨어 미지원 등)
                    sensor.addEventListener('error', (event) => {
                        console.error("센서 에러:", event.error.name);
                        if (event.error.name === 'NotAllowedError') {
                            showMessage("센서 접근 권한이 거부되었습니다.<br><span class='text-xs font-normal'>브라우저 설정에서 모션 센서 권한을 허용해주세요.</span>", true);
                        } else if (event.error.name === 'NotReadableError') {
                            showMessage("기기의 센서 데이터를 읽을 수 없습니다.<br><span class='text-xs font-normal'>센서가 다른 앱에 의해 사용 중이거나 하드웨어 오류일 수 있습니다.</span>", true);
                        } else {
                            showMessage(`센서 초기화 오류 (${event.error.name})`, true);
                        }
                        isSensorActive = false;
                    });

                    // 5. 센서 시작
                    sensor.start();
                    isSensorActive = true;
                    
                    // UI 전환
                    uiStart.style.display = 'none';
                    uiInfo.classList.remove('hidden');
                    showMessage("센서 연결 성공!<br><span class='text-xs font-normal'>기기를 이리저리 회전해보세요.</span>");

                } catch (error) {
                    showMessage("센서 객체를 생성할 수 없습니다.<br><span class='text-xs font-normal'>보안 문제(HTTPS)이거나 기기에서 지원하지 않을 수 있습니다.</span>", true);
                }
            } else {
                // 지원하지 않는 브라우저 처리 (iOS Safari 등)
                showMessage("이 브라우저는 AbsoluteOrientationSensor를 지원하지 않습니다.<br><span class='text-xs font-normal'>Android Chrome을 사용해주세요.</span>", true);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            
            // 센서가 꺼져있을 때는 부드럽게 공전하는 대기 모드 애니메이션
            if (!isSensorActive) {
                phoneBox.rotation.y += 0.01;
                phoneBox.rotation.x = Math.sin(Date.now() * 0.001) * 0.2;
            }

            renderer.render(scene, camera);
        }

        // 초기 애니메이션 시작
        animate();
    </script>
</body>
</html>
