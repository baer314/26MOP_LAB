<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8방향 임계값 테스트 (초기화 및 민감도 조절)</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #222;
      color: white;
      font-family: sans-serif;
    }
    /* 민감도 조절 슬라이더 UI */
    #controlPanel {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #controlPanel label {
      font-size: 18px;
      font-weight: bold;
    }
    input[type=range] {
      width: 250px;
      cursor: pointer;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 30px;
    }
    .cell {
      background-color: #444;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      font-size: 24px;
      transition: background-color 0.1s;
    }
    .active {
      background-color: #00ff88;
      color: black;
      font-weight: bold;
      transform: scale(1.1);
    }
    .btn {
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    #startBtn {
      background-color: #007bff;
      margin-bottom: 20px;
    }
    #resetBtn {
      background-color: #ff4757;
      display: none;
    }
  </style>
</head>
<body>

  <!-- 민감도 조절 패널 -->
  <div id="controlPanel">
    <label for="thresholdSlider">민감도 (임계값): <span id="thresholdValue">15</span>도</label>
    <input type="range" id="thresholdSlider" min="5" max="45" value="15" step="1">
    <small style="color: #ccc;">숫자가 클수록 더 많이 기울여야 반응합니다.</small>
  </div>

  <!-- 시작 버튼 -->
  <button id="startBtn" class="btn">센서 작동 시작</button>

  <!-- 3x3 그리드 -->
  <div id="grid" style="display: none;">
    <div class="cell" id="up-left">↖</div>
    <div class="cell" id="up">↑</div>
    <div class="cell" id="up-right">↗</div>
    <div class="cell" id="left">←</div>
    <div class="cell" id="center">●</div>
    <div class="cell" id="right">→</div>
    <div class="cell" id="down-left">↙</div>
    <div class="cell" id="down">↓</div>
    <div class="cell" id="down-right">↘</div>
  </div>

  <!-- 영점 초기화 버튼 -->
  <button id="resetBtn" class="btn">현재 위치로 영점 초기화</button>

  <script>
    // let으로 변경하여 값을 수정할 수 있게 함
    let THRESHOLD = 15; 
    
    // 민감도 슬라이더 이벤트 연결
    const thresholdSlider = document.getElementById('thresholdSlider');
    const thresholdValue = document.getElementById('thresholdValue');

    thresholdSlider.addEventListener('input', (event) => {
      THRESHOLD = parseInt(event.target.value, 10);
      thresholdValue.textContent = THRESHOLD;
    });
    
    let currentDirection = 'center';
    let offsetX = 0;
    let offsetY = 0;
    let rawX = 0;
    let rawY = 0;

    function updateUI(direction) {
      document.querySelectorAll('.cell').forEach(el => el.classList.remove('active'));
      document.getElementById(direction).classList.add('active');
    }

    function handleOrientation(event) {
      rawX = event.gamma || 0; 
      rawY = event.beta || 0;  

      let x = rawX - offsetX; 
      let y = rawY - offsetY; 

      let dirX = '';
      let dirY = '';

      if (x > THRESHOLD) {
        dirX = '-right';
      } else if (x < -THRESHOLD) {
        dirX = '-left';
      }

      if (y > THRESHOLD) {
        dirY = 'down';
      } else if (y < -THRESHOLD) {
        dirY = 'up';
      }

      let newDirection = dirY + dirX;

      if (newDirection === '') {
        newDirection = 'center';
      } else if (newDirection.startsWith('-')) {
        newDirection = newDirection.substring(1); 
      }

      if (currentDirection !== newDirection) {
        currentDirection = newDirection;
        updateUI(currentDirection);
      }
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              document.getElementById('startBtn').style.display = 'none';
              document.getElementById('grid').style.display = 'grid';
              document.getElementById('resetBtn').style.display = 'block';
              updateUI('center');
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('grid').style.display = 'grid';
        document.getElementById('resetBtn').style.display = 'block';
        updateUI('center');
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      offsetX = rawX;
      offsetY = rawY;
      currentDirection = 'center';
      updateUI('center');
    });
  </script>
</body>
</html>
