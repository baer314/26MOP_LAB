<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트폰 8방향 검술 테스트</title>
    <style>
        /* 기본 전체 화면 설정 */
        body { margin: 0; padding: 0; background-color: #1a1a1a; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        /* 상단 UI (센서 데이터 및 상태 표시) */
        #dashboard { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 10; font-size: 13px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .data-row { margin-bottom: 8px; }
        
        /* 공격 임계값 조절 슬라이더 UI */
        #slider-container { margin-top: 15px; padding-top: 15px; border-top: 1px solid #444; }
        input[type=range] { width: 100%; margin-top: 10px; accent-color: #00b3ff; }
        
        /* 현재 상태(어느 방향으로 베었는지)를 보여주는 알림창 */
        #attack-status { margin-top: 10px; padding: 10px; text-align: center; font-size: 18px; font-weight: bold; border-radius: 5px; border: 2px solid #555; color: #aaa; transition: all 0.1s; }

        /* 하단 제어 버튼 (시작, 영점 조절) */
        #controls { position: absolute; bottom: 20px; width: 100%; text-align: center; z-index: 10; display: flex; justify-content: center; gap: 10px; }
        button { padding: 15px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 30px; background-color: #00ff88; color: #000; cursor: pointer; }
        #start-btn { background-color: #ff3366; color: white; }
        
        /* 화면 중앙 게임 필드 및 8방향 가이드라인 (크로스헤어) */
        #field { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .guide-line { position: absolute; background: rgba(255,255,255,0.1); }
        .guide-v { width: 2px; height: 300px; } /* 수직선 */
        .guide-h { width: 300px; height: 2px; } /* 수평선 */
        .guide-d1 { width: 300px; height: 2px; transform: rotate(45deg); } /* 대각선 1 */
        .guide-d2 { width: 300px; height: 2px; transform: rotate(-45deg); } /* 대각선 2 */
        .center-dot { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; } /* 정중앙 원 */

        /* 3D로 움직이는 스마트폰(검) 모델 */
        /* transition 속성을 통해 타격 시 부드럽게 튕겨나가고 돌아오는 애니메이션 구현 */
        #tracker { width: 40px; height: 80px; background: linear-gradient(135deg, #444, #888); border-radius: 8px; position: absolute; transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; justify-content: center; align-items: center; border: 2px solid #222; }
        #tracker::after { content: '상'; position: absolute; top: 5px; font-size: 12px; color: #111; font-weight: bold; }
    </style>
</head>
<body>

    <div id="dashboard">
        <div class="data-row"><strong>실시간 가속도</strong></div>
        <div class="data-row" id="acc-data">X: 0 | Y: 0 | Z: 0</div>
        
        <div id="slider-container">
            <label><strong>⚔️ 공격 임계값 (Threshold): <span id="threshold-val" style="color:#00b3ff;">15</span></strong></label>
            <input type="range" id="threshold-slider" min="5" max="40" value="15" step="1">
            <div style="font-size: 11px; color: #aaa; margin-top: 5px;">* 이 수치 이상의 힘을 주어야만 8방향으로 반응합니다.</div>
        </div>

        <div id="attack-status">대기 중 (정중앙)</div>
    </div>

    <!-- 8방향 가이드라인 배경 -->
    <div id="field">
        <div class="guide-line guide-v"></div>
        <div class="guide-line guide-h"></div>
        <div class="guide-line guide-d1"></div>
        <div class="guide-line guide-d2"></div>
        <div class="center-dot"></div>
        
        <div id="tracker"></div>
    </div>

    <div id="controls">
        <button id="start-btn">1. 센서 시작</button>
        <button id="cal-btn">2. 중심 영점 조절</button>
    </div>

    <script>
        // ==========================================
        // 1. DOM 요소 가져오기
        // ==========================================
        const tracker = document.getElementById('tracker');
        const accDataDisplay = document.getElementById('acc-data');
        const startBtn = document.getElementById('start-btn');
        const calBtn = document.getElementById('cal-btn');
        const thresholdSlider = document.getElementById('threshold-slider');
        const thresholdVal = document.getElementById('threshold-val');
        const attackStatus = document.getElementById('attack-status');

        // ==========================================
        // 2. 센서 데이터 및 상태 변수
        // ==========================================
        // 자이로 센서 기준점(영점) 저장을 위한 변수
        let calAlpha = 0, calBeta = 0, calGamma = 0;
        // 현재 실시간 자이로 각도 변수
        let currentAlpha = 0, currentBeta = 0, currentGamma = 0;
        
        // 트래커(스마트폰 모델)가 이동할 목표 X, Y 좌표 (기본값은 화면 정중앙인 0)
        let targetPosX = 0, targetPosY = 0;
        
        // 공격 판정을 위한 기준값 (슬라이더로 조절됨)
        let attackThreshold = 15; 
        
        // 쿨타임(Debounce) 상태: 한 번 베면 반동을 무시하기 위해 true로 바뀜
        let isCooldown = false;   

        // 타격 발생 시 트래커가 중앙으로부터 튕겨나갈 거리(픽셀)
        const MOVE_DIST = 130; 
        // 대각선 이동 시 피타고라스 정리에 의한 거리 보정 (MOVE_DIST * sin(45도) ≈ 0.707)
        const DIAG_DIST = MOVE_DIST * 0.707; 

        // ==========================================
        // 3. 버튼 및 슬라이더 이벤트 설정
        // ==========================================
        // 임계값 슬라이더 조절 이벤트
        thresholdSlider.addEventListener('input', (e) => {
            attackThreshold = parseFloat(e.target.value);
            thresholdVal.innerText = attackThreshold; // UI 업데이트
        });

        // 1. 센서 시작 버튼 (아이폰의 경우 권한 팝업 호출)
        startBtn.addEventListener('click', async () => {
            // iOS 13 이상 기기인지 확인
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission === 'granted') { 
                        initSensors(); 
                        startBtn.style.display = 'none'; // 성공 시 버튼 숨김
                    }
                } catch (e) { console.error("센서 권한 요청 에러:", e); }
            } else {
                // 안드로이드 등 권한이 필요 없는 기기
                initSensors(); 
                startBtn.style.display = 'none';
            }
        });

        // 2. 중심 영점 조절 버튼 (현재 각도를 0도로 세팅)
        calBtn.addEventListener('click', () => {
            calAlpha = currentAlpha; 
            calBeta = currentBeta; 
            calGamma = currentGamma;
        });

        // ==========================================
        // 4. 핵심 로직: 8방향 판정 및 타격 실행
        // ==========================================
        function triggerAttack(ax, ay) {
            // 쿨타임 중이면 새로 들어오는 센서값(특히 멈출 때의 반동)은 완벽히 무시함
            if (isCooldown) return; 
            
            isCooldown = true; // 쿨타임 시작

            // Math.atan2(y, x)를 이용해 X, Y 가속도의 비율을 각도(Radian)로 변환
            let angleRad = Math.atan2(ay, ax);
            // Radian 값을 사람이 이해하기 쉬운 Degree(-180도 ~ +180도)로 변환
            let angleDeg = angleRad * (180 / Math.PI);
            
            let directionStr = "";

            // 구한 각도를 45도 간격으로 쪼개어 8방향 중 어디인지 판별
            if (angleDeg >= -22.5 && angleDeg < 22.5) {
                directionStr = "우측 베기 ➡️";
                targetPosX = MOVE_DIST; targetPosY = 0;
            } else if (angleDeg >= 22.5 && angleDeg < 67.5) {
                directionStr = "우상단 베기 ↗️";
                targetPosX = DIAG_DIST; targetPosY = -DIAG_DIST; // 화면 좌표계는 위쪽이 Y축 마이너스(-)임
            } else if (angleDeg >= 67.5 && angleDeg < 112.5) {
                directionStr = "상단 베기 ⬆️";
                targetPosX = 0; targetPosY = -MOVE_DIST;
            } else if (angleDeg >= 112.5 && angleDeg < 157.5) {
                directionStr = "좌상단 베기 ↖️";
                targetPosX = -DIAG_DIST; targetPosY = -DIAG_DIST;
            } else if (angleDeg >= 157.5 || angleDeg < -157.5) {
                directionStr = "좌측 베기 ⬅️";
                targetPosX = -MOVE_DIST; targetPosY = 0;
            } else if (angleDeg >= -157.5 && angleDeg < -112.5) {
                directionStr = "좌하단 베기 ↙️";
                targetPosX = -DIAG_DIST; targetPosY = DIAG_DIST;
            } else if (angleDeg >= -112.5 && angleDeg < -67.5) {
                directionStr = "하단 베기 ⬇️";
                targetPosX = 0; targetPosY = MOVE_DIST;
            } else if (angleDeg >= -67.5 && angleDeg < -22.5) {
                directionStr = "우하단 베기 ↘️";
                targetPosX = DIAG_DIST; targetPosY = DIAG_DIST;
            }
            
            // 시각적 피드백 (성공 이펙트)
            attackStatus.innerText = directionStr;
            attackStatus.style.borderColor = "#00ff88";
            attackStatus.style.color = "#00ff88";
            tracker.style.background = "linear-gradient(135deg, #00ff88, #00b3ff)";
            
            // 💡 실제 게임 개발 시: 여기서 웹소켓(WebSocket)으로 서버에 directionStr을 전송하면 됩니다!
            
            updateTrackerUI(); // 계산된 목표 위치로 트래커 이동 (튕겨나감)

            // 타격 후 0.5초 대기 (무적/쿨타임 구간) -> 이후 다시 중앙으로 복귀
            setTimeout(() => {
                // UI 초기화
                attackStatus.innerText = "대기 중 (정중앙)";
                attackStatus.style.borderColor = "#555";
                attackStatus.style.color = "#aaa";
                tracker.style.background = "linear-gradient(135deg, #444, #888)";
                
                // 타겟 위치를 다시 0(정중앙)으로 되돌림
                targetPosX = 0; 
                targetPosY = 0;
                updateTrackerUI();
                
                isCooldown = false; // 쿨타임 해제, 다음 타격 접수 가능
            }, 500);
        }

        // ==========================================
        // 5. 센서 리스너 등록
        // ==========================================
        function initSensors() {
            // [가속도 센서]: 유저가 언제 힘을 줘서 휘둘렀는지 파악
            window.addEventListener('devicemotion', (event) => {
                // 중력이 제외된 순수 가속도 값 가져오기
                let ax = event.acceleration.x || 0;
                let ay = event.acceleration.y || 0;
                let az = event.acceleration.z || 0;

                accDataDisplay.innerText = `X: ${ax.toFixed(1)} | Y: ${ay.toFixed(1)} | Z: ${az.toFixed(1)}`;
                
                // X, Y, Z 3축 방향 가속도를 모두 더해 하나의 '총 물리력(벡터의 크기)'으로 변환
                let totalMovement = Math.sqrt(ax*ax + ay*ay + az*az);

                // 현재 발생한 힘이 임계값(Threshold)을 넘었고, 쿨타임이 아니라면 타격 함수 호출
                if (totalMovement > attackThreshold && !isCooldown) {
                    // 어떤 방향으로 휘둘렀는지 알기 위해 X, Y 가속도 값을 통째로 넘겨줌
                    triggerAttack(ax, ay);
                }
            });

            // [자이로 센서]: 스마트폰이 현재 어떻게 기울어져 있는지 파악 (3D 회전용)
            window.addEventListener('deviceorientation', (event) => {
                currentAlpha = event.alpha || 0; 
                currentBeta = event.beta || 0; 
                currentGamma = event.gamma || 0;
                
                // 쿨타임(타격 이펙트 재생 중)이 아닐 때만 기기의 미세한 기울기 변화를 화면에 반영
                if(!isCooldown) updateTrackerUI();
            });
        }

        // ==========================================
        // 6. 화면 렌더링 (UI 업데이트)
        // ==========================================
        function updateTrackerUI() {
            // targetPosX, targetPosY: 평소엔 0(중앙)이다가, 타격 판정이 났을 때만 해당 방향 픽셀값으로 변함
            // rotate 3D: 현재 각도에서 영점(cal) 각도를 빼서, 영점 기준으로 얼마나 기울었는지 계산
            tracker.style.transform = `
                translate(${targetPosX}px, ${targetPosY}px)
                rotateX(${currentBeta - calBeta}deg)
                rotateY(${currentGamma - calGamma}deg)
                rotateZ(${-(currentAlpha - calAlpha)}deg)
            `;
        }
    </script>
</body>
</html>
