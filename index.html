<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Air Mouse (devicemotion)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            /* 모바일 브라우저 UI를 제외한 실제 화면 높이에 맞춤 */
            height: 100dvh; 
            width: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: sans-serif;
            touch-action: none; /* 화면 스크롤 방지 */
            box-sizing: border-box;
        }
        
        #pointer {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff3333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
            transition: background-color 0.2s;
            z-index: 100;
            pointer-events: none;
            left: 50%;
            top: 50%;
        }

        #ui-container {
            position: absolute;
            top: max(20px, env(safe-area-inset-top)); /* 노치 디자인 대응 */
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 90%;
        }

        button:active {
            background-color: #0056b3;
            transform: translateY(2px);
        }

        #btn-zero {
            background-color: #28a745;
            display: none;
        }
        
        #btn-zero:active {
            background-color: #1e7e34;
        }

        #debug-panel {
            position: absolute;
            /* 하단 네비게이션 바 및 안전 영역을 고려한 여백 설정 */
            bottom: max(15px, env(safe-area-inset-bottom));
            left: 10px;
            right: 10px; /* 양쪽 여백을 주어 화면에 꽉 차게 맞춤 */
            font-family: monospace;
            /* 화면 크기에 따라 폰트 크기 자동 조절 */
            font-size: clamp(10px, 3vw, 13px); 
            background-color: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 8px;
            pointer-events: none;
            line-height: 1.6;
            word-break: keep-all; /* 단어 단위로 줄바꿈 허용 */
            box-sizing: border-box;
        }

        .debug-row {
            display: flex;
            flex-wrap: wrap; /* 공간이 부족하면 아래로 줄바꿈 */
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
            margin-bottom: 4px;
        }
        
        .debug-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .highlight { color: #00ffcc; }
        .z-axis { color: #ff9900; } 
    </style>
</head>
<body>

    <div id="pointer"></div>

    <div id="ui-container">
        <button id="btn-start">센서 권한 허용 및 시작</button>
        <button id="btn-zero">영점 초기화 (0, 0)</button>
    </div>

    <!-- UI 개선된 디버그 패널 -->
    <div id="debug-panel">
        <div class="debug-row">
            <span>RAW_X: <span id="raw-x">0.00</span></span>
            <span>RAW_Y: <span id="raw-y">0.00</span></span>
            <span class="z-axis">RAW_Z: <span id="raw-z">0.00</span></span>
        </div>
        <div class="debug-row highlight">
            <span>OFFSET_X: <span id="offset-x">0.00</span></span>
            <span>OFFSET_Y: <span id="offset-y">0.00</span></span>
            <span class="z-axis">OFFSET_Z: <span id="offset-z">0.00</span></span>
        </div>
        <div class="debug-row">
            <span>CALIB_X: <span id="calib-x">0.00</span></span>
            <span>CALIB_Y: <span id="calib-y">0.00</span></span>
            <span class="z-axis">CALIB_Z: <span id="calib-z">0.00</span></span>
        </div>
    </div>

    <script>
        let rawX = 0, rawY = 0, rawZ = 0;
        let offsetX = 0, offsetY = 0, offsetZ = 0;
        let smoothedX = 0, smoothedY = 0, smoothedZ = 0;
        
        const filterFactor = 0.8; 
        const sensitivity = 60; 

        const pointer = document.getElementById('pointer');
        const btnStart = document.getElementById('btn-start');
        const btnZero = document.getElementById('btn-zero');
        
        let centerX = window.innerWidth / 2;
        let centerY = window.innerHeight / 2;

        window.addEventListener('resize', () => {
            centerX = window.innerWidth / 2;
            centerY = window.innerHeight / 2;
        });

        btnStart.addEventListener('click', async () => {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        startSensor();
                    } else {
                        alert('센서 접근 권한이 거부되었습니다.');
                    }
                } catch (error) {
                    console.error('권한 요청 에러:', error);
                }
            } else {
                startSensor();
            }
        });

        function startSensor() {
            btnStart.style.display = 'none';
            btnZero.style.display = 'block';
            window.addEventListener('devicemotion', handleMotion);
            requestAnimationFrame(updatePointer);
        }

        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            rawX = acc.x || 0;
            rawY = acc.y || 0;
            rawZ = acc.z || 0; 

            document.getElementById('raw-x').textContent = rawX.toFixed(2);
            document.getElementById('raw-y').textContent = rawY.toFixed(2);
            document.getElementById('raw-z').textContent = rawZ.toFixed(2); 
        }

        btnZero.addEventListener('click', () => {
            offsetX = rawX;
            offsetY = rawY;
            offsetZ = rawZ; 

            smoothedX = 0;
            smoothedY = 0;
            smoothedZ = 0; 

            pointer.style.backgroundColor = '#00ffcc';
            pointer.style.boxShadow = '0 0 15px rgba(0, 255, 204, 0.8)';
            setTimeout(() => {
                pointer.style.backgroundColor = '#ff3333';
                pointer.style.boxShadow = '0 0 10px rgba(255, 51, 51, 0.8)';
            }, 200);

            document.getElementById('offset-x').textContent = offsetX.toFixed(2);
            document.getElementById('offset-y').textContent = offsetY.toFixed(2);
            document.getElementById('offset-z').textContent = offsetZ.toFixed(2); 
        });

        function updatePointer() {
            let calibratedX = rawX - offsetX;
            let calibratedY = rawY - offsetY;
            let calibratedZ = rawZ - offsetZ; 

            smoothedX = smoothedX * filterFactor + calibratedX * (1 - filterFactor);
            smoothedY = smoothedY * filterFactor + calibratedY * (1 - filterFactor);
            smoothedZ = smoothedZ * filterFactor + calibratedZ * (1 - filterFactor); 

            let pointerX = centerX - (smoothedX * sensitivity);
            let pointerY = centerY + (smoothedY * sensitivity);

            // 포인터가 화면 밖으로 나가지 않도록 경계 설정 (창 크기가 변경될 수 있으므로 매 프레임 확인)
            pointerX = Math.max(10, Math.min(window.innerWidth - 10, pointerX));
            pointerY = Math.max(10, Math.min(window.innerHeight - 10, pointerY));

            pointer.style.left = pointerX + 'px';
            pointer.style.top = pointerY + 'px';

            document.getElementById('calib-x').textContent = smoothedX.toFixed(2);
            document.getElementById('calib-y').textContent = smoothedY.toFixed(2);
            document.getElementById('calib-z').textContent = smoothedZ.toFixed(2); 

            requestAnimationFrame(updatePointer);
        }
    </script>
</body>
</html>
