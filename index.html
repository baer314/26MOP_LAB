<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Air Mouse (devicemotion)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: sans-serif;
            touch-action: none; /* 화면 스크롤 방지 */
        }
        
        #pointer {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff3333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
            transition: background-color 0.2s;
            z-index: 100;
            pointer-events: none;
            left: 50%;
            top: 50%;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:active {
            background-color: #0056b3;
            transform: translateY(2px);
        }

        #btn-zero {
            background-color: #28a745;
            display: none;
        }
        
        #btn-zero:active {
            background-color: #1e7e34;
        }

        #debug-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-family: monospace;
            font-size: 13px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            line-height: 1.6;
            white-space: nowrap;
        }

        .highlight { color: #00ffcc; }
        .z-axis { color: #ff9900; } /* Z축은 다른 색으로 구분 */
    </style>
</head>
<body>

    <div id="pointer"></div>

    <div id="ui-container">
        <button id="btn-start">센서 권한 허용 및 시작</button>
        <button id="btn-zero">영점 초기화 (0, 0)</button>
    </div>

    <!-- Z축이 추가된 디버그 패널 -->
    <div id="debug-panel">
        <div>RAW_X: <span id="raw-x">0.00</span> | RAW_Y: <span id="raw-y">0.00</span> | <span class="z-axis">RAW_Z: <span id="raw-z">0.00</span></span></div>
        <div>OFFSET_X: <span id="offset-x" class="highlight">0.00</span> | OFFSET_Y: <span id="offset-y" class="highlight">0.00</span> | <span class="z-axis highlight">OFFSET_Z: <span id="offset-z">0.00</span></span></div>
        <div>CALIB_X: <span id="calib-x">0.00</span> | CALIB_Y: <span id="calib-y">0.00</span> | <span class="z-axis">CALIB_Z: <span id="calib-z">0.00</span></span></div>
    </div>

    <script>
        // 원본 센서값 (Z축 추가)
        let rawX = 0, rawY = 0, rawZ = 0;
        
        // 영점 조절 오프셋 (Z축 추가)
        let offsetX = 0, offsetY = 0, offsetZ = 0;

        // 로우패스 필터값 (Z축 추가)
        let smoothedX = 0, smoothedY = 0, smoothedZ = 0;
        const filterFactor = 0.8; 
        const sensitivity = 60; 

        const pointer = document.getElementById('pointer');
        const btnStart = document.getElementById('btn-start');
        const btnZero = document.getElementById('btn-zero');
        
        let centerX = window.innerWidth / 2;
        let centerY = window.innerHeight / 2;

        window.addEventListener('resize', () => {
            centerX = window.innerWidth / 2;
            centerY = window.innerHeight / 2;
        });

        btnStart.addEventListener('click', async () => {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        startSensor();
                    } else {
                        alert('센서 접근 권한이 거부되었습니다.');
                    }
                } catch (error) {
                    console.error('권한 요청 에러:', error);
                }
            } else {
                startSensor();
            }
        });

        function startSensor() {
            btnStart.style.display = 'none';
            btnZero.style.display = 'block';
            window.addEventListener('devicemotion', handleMotion);
            requestAnimationFrame(updatePointer);
        }

        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            // X, Y, Z축 데이터 추출
            rawX = acc.x || 0;
            rawY = acc.y || 0;
            rawZ = acc.z || 0; // Z축 추가

            document.getElementById('raw-x').textContent = rawX.toFixed(2);
            document.getElementById('raw-y').textContent = rawY.toFixed(2);
            document.getElementById('raw-z').textContent = rawZ.toFixed(2); // Z축 디스플레이
        }

        btnZero.addEventListener('click', () => {
            // 현재 상태를 오프셋으로 저장 (Z축 포함)
            offsetX = rawX;
            offsetY = rawY;
            offsetZ = rawZ; // Z축 오프셋 저장

            // 필터링된 과거 값들을 즉시 0으로 초기화
            smoothedX = 0;
            smoothedY = 0;
            smoothedZ = 0; // Z축 초기화

            pointer.style.backgroundColor = '#00ffcc';
            pointer.style.boxShadow = '0 0 15px rgba(0, 255, 204, 0.8)';
            setTimeout(() => {
                pointer.style.backgroundColor = '#ff3333';
                pointer.style.boxShadow = '0 0 10px rgba(255, 51, 51, 0.8)';
            }, 200);

            document.getElementById('offset-x').textContent = offsetX.toFixed(2);
            document.getElementById('offset-y').textContent = offsetY.toFixed(2);
            document.getElementById('offset-z').textContent = offsetZ.toFixed(2); // Z축 오프셋 디스플레이
        });

        function updatePointer() {
            // 오프셋이 적용된 순수 기울기 값 계산 (Z축 포함)
            let calibratedX = rawX - offsetX;
            let calibratedY = rawY - offsetY;
            let calibratedZ = rawZ - offsetZ; // Z축 보정값

            // 로우패스 필터(Low-pass Filter) 적용
            smoothedX = smoothedX * filterFactor + calibratedX * (1 - filterFactor);
            smoothedY = smoothedY * filterFactor + calibratedY * (1 - filterFactor);
            smoothedZ = smoothedZ * filterFactor + calibratedZ * (1 - filterFactor); // Z축 필터

            // 2D 포인터 이동 로직 (X, Y만 사용)
            let pointerX = centerZ - (smoothedZ * sensitivity);
            let pointerY = centerY - (smoothedY * sensitivity);

            pointerX = Math.max(10, Math.min(window.innerWidth - 10, pointerX));
            pointerY = Math.max(10, Math.min(window.innerHeight - 10, pointerY));

            pointer.style.left = pointerX + 'px';
            pointer.style.top = pointerY + 'px';

            // 디버그 패널에 최종 값 업데이트 (Z축 포함)
            document.getElementById('calib-x').textContent = smoothedX.toFixed(2);
            document.getElementById('calib-y').textContent = smoothedY.toFixed(2);
            document.getElementById('calib-z').textContent = smoothedZ.toFixed(2); // Z축 최종 디스플레이

            requestAnimationFrame(updatePointer);
        }
    </script>
</body>
</html>
