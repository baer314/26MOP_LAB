<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8방향 임계값 테스트 (초기화 포함)</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #222;
      color: white;
      font-family: sans-serif;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 10px;
      margin-top: 20px;
      margin-bottom: 30px;
    }
    .cell {
      background-color: #444;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      font-size: 24px;
      transition: background-color 0.1s;
    }
    /* 활성화된 방향의 스타일 */
    .active {
      background-color: #00ff88;
      color: black;
      font-weight: bold;
      transform: scale(1.1);
    }
    .btn {
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    #startBtn {
      background-color: #007bff;
    }
    #resetBtn {
      background-color: #ff4757;
      display: none; /* 처음에는 숨김 */
    }
  </style>
</head>
<body>

  <!-- iOS 권한 요청을 위한 시작 버튼 -->
  <button id="startBtn" class="btn">센서 작동 시작</button>

  <!-- 8방향 + 중앙을 보여주는 3x3 그리드 -->
  <div id="grid" style="display: none;">
    <div class="cell" id="up-left">↖</div>
    <div class="cell" id="up">↑</div>
    <div class="cell" id="up-right">↗</div>
    <div class="cell" id="left">←</div>
    <div class="cell" id="center">●</div>
    <div class="cell" id="right">→</div>
    <div class="cell" id="down-left">↙</div>
    <div class="cell" id="down">↓</div>
    <div class="cell" id="down-right">↘</div>
  </div>

  <!-- 기준점 초기화 버튼 -->
  <button id="resetBtn" class="btn">현재 위치로 영점 초기화</button>

  <script>
    const THRESHOLD = 15; // 임계값 (각도)
    
    let currentDirection = 'center';

    // 초기화(영점 조절)를 위한 오프셋 변수
    let offsetX = 0;
    let offsetY = 0;
    
    // 현재 센서의 원본 값을 저장할 변수
    let rawX = 0;
    let rawY = 0;

    function updateUI(direction) {
      document.querySelectorAll('.cell').forEach(el => el.classList.remove('active'));
      document.getElementById(direction).classList.add('active');
    }

    function handleOrientation(event) {
      // 센서에서 받아오는 원본 데이터 저장
      rawX = event.gamma || 0; // 좌우
      rawY = event.beta || 0;  // 상하

      // 원본 데이터에서 초기화(오프셋) 값을 빼서 계산할 기준 각도 생성
      let x = rawX - offsetX; 
      let y = rawY - offsetY; 

      let dirX = '';
      let dirY = '';

      // 1. 좌우(X축) 임계값 판별
      if (x > THRESHOLD) {
        dirX = '-right';
      } else if (x < -THRESHOLD) {
        dirX = '-left';
      }

      // 2. 상하(Y축) 임계값 판별
      if (y > THRESHOLD) {
        dirY = 'down';
      } else if (y < -THRESHOLD) {
        dirY = 'up';
      }

      // 3. 방향 조합
      let newDirection = dirY + dirX;

      // 4. 문자열 정리
      if (newDirection === '') {
        newDirection = 'center';
      } else if (newDirection.startsWith('-')) {
        newDirection = newDirection.substring(1); 
      }

      // 방향 변경 시에만 UI 업데이트
      if (currentDirection !== newDirection) {
        currentDirection = newDirection;
        updateUI(currentDirection);
      }
    }

    // 센서 시작 버튼 클릭 이벤트
    document.getElementById('startBtn').addEventListener('click', () => {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              document.getElementById('startBtn').style.display = 'none';
              document.getElementById('grid').style.display = 'grid';
              document.getElementById('resetBtn').style.display = 'block';
              updateUI('center');
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('grid').style.display = 'grid';
        document.getElementById('resetBtn').style.display = 'block';
        updateUI('center');
      }
    });

    // 영점 초기화 버튼 클릭 이벤트
    document.getElementById('resetBtn').addEventListener('click', () => {
      // 버튼을 누르는 순간의 원본 센서 값을 오프셋으로 저장
      offsetX = rawX;
      offsetY = rawY;
      
      // 즉시 중앙으로 UI 리셋
      currentDirection = 'center';
      updateUI('center');
    });
  </script>
</body>
</html>
