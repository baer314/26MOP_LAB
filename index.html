<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>조이콘 스타일 에어 마우스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: white;
            overflow: hidden;
            touch-action: none; /* 터치 스크롤 방지 */
        }
        
        /* 조준선 커서 디자인 */
        #cursor {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid #00ff00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            z-index: 50;
            transition: transform 0.05s linear;
        }
        
        #cursor::before, #cursor::after {
            content: '';
            position: absolute;
            background-color: #00ff00;
        }
        
        /* 십자선 */
        #cursor::before { top: 50%; left: -10px; right: -10px; height: 2px; transform: translateY(-50%); }
        #cursor::after { left: 50%; top: -10px; bottom: -10px; width: 2px; transform: translateX(-50%); }

        .btn-press {
            transition: transform 0.1s, filter 0.1s;
        }
        .btn-press:active {
            transform: scale(0.95);
            filter: brightness(0.8);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative">

    <!-- 조준선 커서 -->
    <div id="cursor" style="left: 50%; top: 50%;"></div>

    <div id="start-screen" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-40 backdrop-blur-sm">
        <h1 class="text-3xl font-bold text-green-400 mb-4"><i class="fa-solid fa-gamepad"></i> 조이콘 에어 마우스</h1>
        <p class="text-gray-300 text-center mb-8 text-sm px-6">
            기기를 바닥과 수평으로 들고(리모컨처럼) 시작하세요.<br>
            자이로스코프(회전 속도)를 이용해 커서가 부드럽게 이동합니다.
        </p>
        <button id="btn-start" class="btn-press bg-green-500 text-black font-bold text-xl py-4 px-10 rounded-full shadow-[0_0_20px_rgba(0,255,0,0.4)]">
            시작하기 (권한 요청)
        </button>
    </div>

    <!-- UI 오버레이 -->
    <div class="absolute bottom-10 left-0 right-0 flex justify-center gap-6 z-30">
        <button id="btn-recenter" class="btn-press bg-gray-800 border-2 border-gray-600 text-white rounded-full w-20 h-20 flex flex-col items-center justify-center shadow-lg">
            <i class="fa-solid fa-crosshairs text-2xl mb-1 text-blue-400"></i>
            <span class="text-[10px]">영점(Y)</span>
        </button>
        
        <button class="btn-press bg-green-600 border-2 border-green-500 text-white rounded-full w-20 h-20 flex flex-col items-center justify-center shadow-lg">
            <i class="fa-solid fa-fire text-2xl mb-1"></i>
            <span class="text-[10px]">클릭(A)</span>
        </button>
    </div>

    <!-- 디버그 정보 -->
    <div class="absolute top-4 left-4 text-xs font-mono text-gray-500 z-10 pointer-events-none">
        <div id="debug-yaw">Yaw (Left/Right): 0.00</div>
        <div id="debug-pitch">Pitch (Up/Down): 0.00</div>
    </div>

    <script>
        const cursor = document.getElementById('cursor');
        const btnStart = document.getElementById('btn-start');
        const startScreen = document.getElementById('start-screen');
        const btnRecenter = document.getElementById('btn-recenter');
        
        // 화면 크기
        let screenW = window.innerWidth;
        let screenH = window.innerHeight;
        window.addEventListener('resize', () => {
            screenW = window.innerWidth;
            screenH = window.innerHeight;
        });

        // 커서 위치 (초기값 화면 중앙)
        let cursorX = screenW / 2;
        let cursorY = screenH / 2;

        // 조이콘 세팅값
        const SENSITIVITY = 18.0; // 감도 (클수록 빠름)
        const DEADZONE = 0.8;     // 데드존 (초당 회전 각도가 이 값 이하면 무시하여 수전증/드리프트 방지)

        let lastTime = 0;

        function handleMotion(event) {
            const rr = event.rotationRate;
            if (!rr || rr.alpha === null) return;

            // 시간 차이(Delta Time) 계산
            const now = performance.now();
            if (lastTime === 0) { lastTime = now; return; }
            const dt = (now - lastTime) / 1000; // 초 단위 변환
            lastTime = now;

            // 기기를 수평으로 들고(리모컨처럼) 앞을 가리킬 때:
            // Alpha: 좌우 회전 (Yaw)
            // Beta: 위아래 고개 끄덕임 (Pitch)
            let yawRate = rr.alpha; 
            let pitchRate = rr.beta;

            // 데드존 적용 (수치 미만의 미세한 떨림은 무시)
            if (Math.abs(yawRate) < DEADZONE) yawRate = 0;
            if (Math.abs(pitchRate) < DEADZONE) pitchRate = 0;

            // 디버그 텍스트 업데이트
            document.getElementById('debug-yaw').textContent = `Yaw: ${yawRate.toFixed(2)}`;
            document.getElementById('debug-pitch').textContent = `Pitch: ${pitchRate.toFixed(2)}`;

            // 속도 * 시간 * 감도 = 이동 거리(Delta)
            // 방향 반전이 필요하면 여기의 + / - 기호를 바꿉니다.
            const dx = yawRate * dt * SENSITIVITY;
            const dy = pitchRate * dt * SENSITIVITY;

            cursorX -= dx; // 좌우
            cursorY -= dy; // 상하

            // 화면 밖으로 나가지 않도록 제한 (Clamping)
            cursorX = Math.max(20, Math.min(screenW - 20, cursorX));
            cursorY = Math.max(20, Math.min(screenH - 20, cursorY));
        }

        // 화면 업데이트 (부드러운 렌더링)
        function updateDisplay() {
            cursor.style.left = `${cursorX}px`;
            cursor.style.top = `${cursorY}px`;
            requestAnimationFrame(updateDisplay);
        }

        // 영점 조준 함수 (화면 중앙으로 리셋)
        function recenter() {
            cursorX = screenW / 2;
            cursorY = screenH / 2;
            
            // 시각적 피드백 (깜빡임 효과)
            cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
            cursor.style.borderColor = 'white';
            setTimeout(() => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                cursor.style.borderColor = '#00ff00';
            }, 100);
        }

        btnRecenter.addEventListener('click', recenter);

        // 시작 버튼 (권한 요청 및 이벤트 등록)
        btnStart.addEventListener('click', async () => {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission === 'granted') {
                        initSensors();
                    } else {
                        alert("센서 권한이 거부되었습니다.");
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                initSensors();
            }
        });

        function initSensors() {
            startScreen.style.display = 'none';
            lastTime = performance.now();
            
            // Orientation 대신 Motion(가속도/자이로) 이벤트 사용
            window.addEventListener('devicemotion', handleMotion);
            
            // 렌더링 루프 시작
            updateDisplay();
        }
    </script>
</body>
</html>
